<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>注销通知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">

<style>
:root{
  --paper:#fbfaf7;
  --ink:#2b2a27;
  --ink-soft:#6f6d66;
  --ink-faint:#a3a099;
  --rule:#e2dfd8;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:18px;line-height:2.05;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#e8e2d4}

/* 顶栏：只有书名和几个文字链 */
.bar{
  max-width:680px;margin:0 auto;padding:38px 28px 0;
  display:flex;align-items:baseline;gap:16px;
}
.bar .book{font-size:15px;letter-spacing:.18em;color:var(--ink-faint);font-weight:400}
.bar nav{margin-left:auto;display:flex;gap:20px}
.bar nav button{
  border:0;background:none;padding:0;cursor:pointer;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-faint);
  letter-spacing:.06em;transition:color .15s;
}
.bar nav button:hover{color:var(--ink)}
.bar nav button[aria-current="true"]{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:1px}
:focus-visible{outline:2px solid #b9a888;outline-offset:3px}

#divider{max-width:680px;margin:16px auto 0;padding:0 28px;border:0;border-top:1px solid var(--rule)}

/* 正文 */
.sheet{max-width:680px;margin:0 auto;padding:46px 28px 0}
body[data-kind="chapter"] .sheet{padding-top:60px}
h1.booktitle{
  font-size:15px;font-weight:400;letter-spacing:.24em;color:var(--ink-faint);
  text-align:center;margin-bottom:22px;
}
.chapno{
  text-align:center;font-size:12.5px;letter-spacing:.34em;color:var(--ink-faint);
  margin-bottom:14px;
}
h2.chapname{
  font-size:30px;font-weight:600;letter-spacing:.1em;line-height:1.5;
  text-align:center;margin:0 0 44px;
}
.chapname::after{
  content:"";display:block;width:34px;height:1px;background:var(--rule);
  margin:26px auto 0;
}
.endmark{
  text-align:center;font-size:12.5px;letter-spacing:.4em;color:var(--ink-faint);
  margin:56px 0 0;
}

/* 文档型（非正文）排版 */
.doc .sheet{padding-top:44px}
.doc h1{
  font-size:14px;font-weight:400;letter-spacing:.2em;color:var(--ink-faint);
  padding-bottom:14px;margin:0 0 34px;border-bottom:1px solid var(--rule);
}
.doc h2{font-size:21px;font-weight:600;margin:44px 0 14px;letter-spacing:.02em}
.doc h3{font-size:16.5px;font-weight:600;margin:28px 0 8px}
.doc h4{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-soft);margin:24px 0 6px}
.doc p{margin:0 0 16px}
.doc ul,.doc ol{margin:0 0 18px;padding-left:20px}
.doc li{margin:5px 0}
.doc li::marker{color:var(--ink-faint)}
.doc blockquote{
  margin:0 0 18px;padding:1px 0 1px 16px;
  border-left:2px solid #ddd7ca;color:var(--ink-soft);font-size:16.5px;
}
.doc code{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.85em;background:#f1eee7;padding:1px 5px;border-radius:2px;
}
.doc pre{
  background:#f4f1ea;border:1px solid var(--rule);border-radius:3px;
  padding:15px;overflow-x:auto;margin:0 0 18px;
}
.doc pre code{background:none;padding:0;font-size:11.5px;line-height:1.7;color:var(--ink-soft)}

/* 正文小说：中文排版惯例 */
.chapter p{text-indent:2em;margin:0 0 18px}
.chapter .prose hr{
  border:0;margin:34px 0;text-align:center;height:auto;
  color:var(--ink-faint);font-size:14px;letter-spacing:1em;
}
.chapter .prose hr::after{content:"— · —"}

.tw{overflow-x:auto;margin:0 0 22px;border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}
th{
  background:#f4f1ea;text-align:left;padding:9px 12px;font-weight:600;font-size:12px;
  letter-spacing:.08em;color:var(--ink-soft);border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #eeebe4;vertical-align:top;line-height:1.7}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap;color:var(--ink-faint)}

/* 结尾导航 */
.foot{
  max-width:680px;margin:60px auto 0;padding:0 28px 70px;
}
.foot .next{
  display:block;width:100%;text-align:center;padding:22px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;cursor:pointer;
  font-family:var(--serif);font-size:15px;color:var(--ink-soft);
  transition:color .15s;
}
.foot .next:hover{color:var(--ink)}
.foot .next small{display:block;font-size:12px;color:var(--ink-faint);letter-spacing:.14em;margin-top:7px}
.foot .meta{
  margin-top:26px;text-align:center;font-size:11.5px;color:var(--ink-faint);letter-spacing:.12em;
}
.foot .meta button{
  border:0;background:none;cursor:pointer;font:inherit;color:inherit;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);
}

.fade{animation:f .28s ease both}
@keyframes f{from{opacity:0}to{opacity:1}}

@media(max-width:640px){
  body{font-size:17px;line-height:2}
  .bar,.rule,.sheet,.foot{padding-left:20px;padding-right:20px}
  h2.chapname{font-size:25px}
  .bar{gap:10px;padding-top:28px}
  .bar nav{gap:14px}
  .bar nav button{font-size:12.5px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

<script>
const DATA = {"docs": {"ch1": {"body": "# 第一章 注销通知\n\n门外有人敲了两下。\n\n沈砚抬头看了一眼屏幕。数字还在往下跳。\n\n敲门的是前台的义工。她探进半个身子。\n\n“沈老师，”她说，“陈素芬家属又来了。”\n\n“多久了。”\n\n“早上六点。现在十一点四十。”\n\n义工说完就走了。她很懂规矩——接下来的对话不该有第三个人在场。\n\n沈砚走回三号注销间，重新坐下。\n\n陈素芬还在擦那个杯子。她七十二岁，公交车售票员，退休二十六年，现在在家属院给人修拉链，一天挣十二块。\n\n陈素芬三天前死了。准确地说，是肉身死了。\n\n但她的“回声”被系统存了下来——性格、记忆、说话的习惯，全存成一个能说能笑的东西，在织机里接着“活”。这东西统共只能活七十二小时。\n\n今天是第三天。\n\n她记得沈砚的名字，也记得自己已经死了。这一点她一直没提，沈砚也没问。\n\n“又有事？”她说。\n\n“你女儿想续期。”\n\n陈素芬把手放下了。\n\n“续多久。”\n\n“二十四小时。”\n\n“那你倒是接啊。”\n\n沈砚没有接话。\n\n“陈姨，”他说，“按规程，你的窗口满了。”\n\n陈素芬看着他。她的手在半空停了一下，收了回去。\n\n“哦。”\n\n这一个“哦”字，她说了四十年。\n\n“我不续。”她说。\n\n“我没问你要不要续。”\n\n“我知道。”陈素芬说，“你问的是你让不让。”\n\n——\n\n沈砚是注销员。\n\n人死之后，会在织机里醒过来，七十二个小时。这七十二小时里，你能去看她，她能跟你说话，记得你的名字，甚至能跟你吵一架。七十二小时一到，系统自动注销，她就真的没了。\n\n这件事以前是没有的。\n\n以前人死了就是死了。一张床，一个日期，几个人办手续时哭一场，然后就没有然后了。\n\n现在不一样了。现在多出来三天。\n\n多出来的这三天归注销员管。注销员陪着走完，然后在最后一格按下一个键。系统会响一声，然后那个人就走了。\n\n——\n\n“按规程，”沈砚说，“谁的签字都不行，只看窗口。”\n\n“我知道。”\n\n“你女儿电话里哭了。”\n\n“我知道。”陈素芬说，“我也哭。我哭完还在这儿坐着。”\n\n“可我要是走了，”她说，“她下个月就来了。一个人。”\n\n沈砚没说话。\n\n“小姑娘不容易。”陈素芬说，“她这个月第三趟了。”\n\n“我知道。”\n\n“你知道什么？”\n\n沈砚说：“我知道她姓什么。知道她三十二岁。知道她在纺织厂三班倒，三天倒一次班，昨天是白班。知道她今天早上六点出门，没吃饭。知道她进门的时候左脚先迈的，因为右脚鞋带松了，她没蹲下系，她不会在一个陌生地方蹲下系鞋带。”\n\n陈素芬看了他一会儿。\n\n“那你让她别来了。”\n\n“我做不了这个。”\n\n“那你就不该坐在这儿。”陈素芬把杯子往旁边推了推，“你坐着，我就老想着说不说。”\n\n沈砚没动。\n\n“再跟你说一句。”他说，“续期不是免费的。你别以为我们卡你。”\n\n“卡我？”\n\n“系统给你批了，账就记在别处。”沈砚说，“织机会从全网抽走等量的在线时长，补这一次运行烧掉的东西。”\n\n“抽谁的？”\n\n“抽那些不会有人问的。”\n\n陈素芬看着他。\n\n“那就是不抽我。”\n\n“是不抽你。”沈砚说，“抽的是那些正在上班的、正在上课的、正在直播的。他们那一小时没了，没有人知道，也没有地方去问。”\n\n“所以你们就抽别人。”\n\n“我们只是签字。”沈砚说，“签字的人不下手，但是签字的人也不拦。”\n\n屋里安静了两秒。\n\n陈素芬把杯子又拿起来，慢慢擦。\n\n“那一小时，”她说，“对人家也就是刷会儿手机。”\n\n“对人家是。”\n\n她点点头，没再说话。\n\n过了一会儿，她抬头。\n\n“你们这行啊。”\n\n“怎么。”\n\n“不容易。”她说，“你们以为自己在做坏事，其实你们只是把坏事办完了。”\n\n沈砚站起来。\n\n“您还有两个半小时。”\n\n“我知道。”\n\n“想说什么就说。”\n\n“你不是有。”陈素芬说，“你是有两个半小时。”\n\n——\n\n四个半小时之前，他刚签过一个。\n\n签完之后他没喝水。他坐在那儿等手不抖。\n\n等到现在，手也不抖了。\n\n四年，就练成这一件事：签字的时候手不能抖，签完了更不能。\n\n抖了，就得问自己为什么签。\n\n为什么不签，又得问自己凭什么。\n\n两个问题都没答案，所以两个都不问。练到第四年，手就稳了，心也就稳了。\n\n他管这个叫手感。\n\n处里新来的人管这叫本事。\n\n——\n\n他知道这行有个说法：进门不能哭。\n\n因为一哭，就说明你把这事儿当成了一件事。\n\n当成一件事，就说明你知道对面坐着的是谁。\n\n知道了，就会开始想：我今晚回去，跟谁说。\n\n注销员一共九个人，四个注销间，一天十六单。人手卡得死死的，所以永远有人在，永远都在赶。\n\n沈砚在这儿四年，一年签一千二百多份，没出过错。\n\n他把工作做得干净、准时、没人挑得出毛病。\n\n没人挑得出毛病，是因为没人看得出别的。\n\n——\n\n“我老伴走了十二年了。”陈素芬说。\n\n这是她今天第六遍讲。\n\n“我知道。”\n\n“你不知道。”她说，“十二年，我一个人，一间房，一张床。我睡左边，他睡右边。十二年我都没换过。”\n\n她抬起头。\n\n“你知道为什么吗？”\n\n沈砚没说话。\n\n“因为睡着了要是滚过去，”她说，“醒来他得重新回来。多累啊。”\n\n注销间的空调出风口在响。很轻，一直响。\n\n倒计时一分十二秒。\n\n“别催。”她抬手挡了一下，像挡太阳，“我这辈子被人催过三回。头一回是我妈叫我吃饭，第二回是公交公司叫我发车。”\n\n“第三回呢。”\n\n陈素芬想了一会儿。\n\n“第三回……想不起来了。”她笑，“老了。”\n\n沈砚在记录板上写了一行字。\n\n他没有告诉她：回声忘事，是权重在掉。他也没告诉她，她每忘一次，档案里就多一行蓝色的字，蓝色的字是给机器看的，不是给人看的。\n\n他写的是：**认知区轻度衰减，建议家属减少刺激性对话。**\n\n这句话他写过四百多次。\n\n每次都像在替谁开一张假证明。\n\n——\n\n一分十二秒里有很长一段。\n\n陈素芬忽然说：“小伙子。”\n\n“嗯。”\n\n“你是不是也不太想走。”\n\n沈砚的手指停在半空。\n\n“陈姨。”\n\n“我就随便问问。”她说，“不答也行。”\n\n沈砚把笔放下。\n\n屋里安静了一下。空调还在响。\n\n“你说什么呢。”他说。\n\n“我说，”陈素芬把杯子又拿起来，慢慢擦，“你坐这个位置四年了。我今天看见你换了三个杯子，每个都用一样的水泡过一遍再倒掉。你怕我们喝了你的水。”\n\n她说得很慢，像在报一个站名。\n\n“你们这些人不坏。”她说，“你们就是不想待在这儿。”\n\n沈砚没有说话。\n\n“你要真不想待着，”陈素芬说，“你现在就可以走。反正我是自动的，到点我自己没。你按不按那个键，我都知道。”\n\n“陈姨——”\n\n“你别管我。”她抬手，“我就是随口一说。我老了，我话多。”\n\n她低头接着擦杯子。\n\n沈砚坐回去，把手放在膝盖上。\n\n他坐得很直。\n\n——\n\n到点了。\n\n屏幕上的数字跳到 00:00:00，然后定住，变成一行灰字。\n\n陈素芬没有变。\n\n她还是那个姿势，手里还拿着杯子。\n\n设计者在这件事上达成了一致——让回声疼，是件太残忍的事，所以回声在结束时不会变。\n\n沈砚按了那个键。\n\n系统响了一声。\n\n很短的一声。\n\n然后陈素芬手里的杯子落回桌上，水晃出来一圈。\n\n她坐在那儿，眼睛还睁着，像在等下一班车。\n\n沈砚站起来，收走桌上两个纸杯，捏在一起，扔进门边的回收桶。\n\n他做这套动作做了四年，每天做四遍。手知道怎么做，脑子可以不想事。\n\n这是他工作内容里唯一不需要负责的部分。\n\n他走到门口，回头看了一眼。\n\n陈素芬还坐着。手背上有一道很厚的茧，握笔磨的。\n\n沈砚把门带上。\n\n——\n\n走廊比注销间亮。他眯了一下眼。\n\n四楼尽头有一扇窗，窗台上常年摆着一盆死了的绿萝。处里没人承认是自己的，但也没人扔。\n\n电梯要等两趟。下来的时候，清洁工推着铁皮车进来了。\n\n“早。”清洁工说。\n\n“……几点了。”\n\n“都过午了，小沈。”清洁工笑了，“你今天又没看表。”\n\n沈砚愣了一下。\n\n他确实一整天没看表。\n\n“今天几个？”清洁工问。\n\n“三个半。”沈砚说，“我接了一个半。”\n\n“那比我忙。”清洁工按了负一，“我就四楼。”\n\n电梯往下走。两个人都没再说话。\n\n——\n\n工位在注销处东侧，十二个位置，现在坐着九个。\n\n沈砚坐下，开机。\n\n开机要十一秒。这是他每天早上最长的十一秒。\n\n屏幕亮起来。\n\n他打开任务队列。\n\n今天十六单，按时间排，规规矩矩。\n\n他往下扫。\n\n准备关掉。\n\n手停住了。\n\n——\n\n队列最底下多了一条。\n\n没有颜色，没有加急符号，没有任何标记。它就那样待在最底下，像一颗沉到河床里的石子——没人在意，但它在那儿。\n\n不是今天的单。\n\n是三年前的。\n\n沈砚把鼠标往上移了一点，让那行字进到正中。\n\n**回声编号**：E-1109-林秀云\n**姓名**：林秀云\n**状态**：已注销\n**归档日**：2032-10-12\n\n他看着这行字。\n\n一秒。两秒。三秒。\n\n他伸手把屏幕亮度调高了一格。\n\n没有变化。还是那行字。\n\n**最近一次续期**：第 1095 次\n**申请人签名**：沈砚\n\n——\n\n他的手指按在桌沿上。\n\n不抖。\n\n四年，一千二百一十七份，他的手一次都没有抖过。\n\n现在也没有。\n\n这不是抖。这是**用力**。\n\n他在用力把那只手按在桌沿上。\n\n——\n\n沈砚今天早上拒了陈素芬女儿一次。\n\n那不是大事。那是规程。规程上写着“窗口已满不得续期”，他只是照着做了一千遍里的第一遍。\n\n现在他坐在这里，手压着桌沿，看着那行字。\n\n一千零九十五次。\n\n有人用他的名字，在三年里，求了一千零九十五次让一个人留下来。\n\n一次都没批。\n\n——\n\n周执端着咖啡从旁边过来，把罐子放在他桌上。\n\n“四号的人呢。”\n\n“自动到期了。”\n\n“说什么了。”\n\n“问我喝不喝水。”\n\n周执笑了：“她每次都问这个。”\n\n沈砚没接。\n\n周执站着看了他两秒。\n\n“你手攥那么紧干嘛。”\n\n沈砚把手松开。\n\n桌沿上被压出一小块白印，一会儿就会消。\n\n“没事。”他说。\n\n周执没追问。他从来不追问。\n\n他把咖啡往沈砚手边推了推，转身走了。\n\n沈砚看着那罐咖啡。\n\n他没有拿。\n\n他这四年，桌上摆过的咖啡比喝过的水多。凉了就倒掉，倒掉之前从不看是谁请的。谁请的他也不想知道。\n\n知道的越多，就越走不出去。\n\n——\n\n他点开那行字。\n\n详情页加载了半秒。\n\n大部分字段是灰的。灰色意思是**只读**，意思是这件事已经结束了，任何人都不该再看它。\n\n沈砚往下滚。\n\n**回声编号**：E-1109-林秀云\n**生卒**：1935-04-11 — 2032-10-12\n**录入方式**：本人签署\n**首次上线**：2032-10-10 00:00:07\n**归档时间**：2032-10-12 23:59:51\n**归档方式**：系统自动注销\n**归档原因**：72小时窗口到期\n\n他停在这一行。\n\n归档方式：系统自动注销。\n\n归档原因：72小时窗口到期。\n\n这跟陈素芬今天一样。\n\n也就是说，三年前那个夜里，没有人按过键。系统自己到点，自己关掉的。\n\n那一天，他在外地。他在考场。他后来收到一条推送，点开是“回声窗口已关闭”。\n\n他当时觉得这样也好，省得他不知道说什么。\n\n然后是下面那一行。\n\n**最后一次续期申请**：已驳回\n**申请人签名**：沈砚\n\n——\n\n注销间的空调大概是从四号那边漏过来的。\n\n他没觉得冷。\n\n他记得那天的题。记得窗外有个女生在哭。记得自己把笔转了两圈才继续写。\n\n他记得自己没签过任何东西。\n\n他也记得——\n\n他记得自己那天**没有去**。\n\n——\n\n天亮了。窗外还是灰的，那盏走廊灯还亮着，四楼尽头的绿萝还死着。\n\n沈砚把记录板推到一边，站起来。\n\n他没有去泡咖啡，没有去洗手间，没有去看下一份待办。\n\n他走到门口，刷了工牌，进了电梯。\n\n电梯往下走。\n\n他按的不是负一。\n\n——\n\n---\n\n*（第一章完）*\n"}, "outline": {"body": "# 《注销通知》 大纲\n\n## 基本信息\n\n- **题材**：科幻 / 悬疑 / 家庭\n- **预计章节数**：24 章\n- **目标字数**：每章 3000-5000 字，总计约 10 万字\n- **核心冲突**：沈砚要用三年时间查清\"我为什么杀了我妈\"，却发现真正该被查清的是——他这三年之所以能活得像个正常人，是因为有人在替他付账，而账已经记在了全世界头上。\n- **叙事视角**：第三人称限制视角，全程锁定沈砚。全书唯一一次视角切换在第 21 章（牧羊人视角，且极短）。\n- **时间线锚点**：主线跨度 9 天（10 月 18 日 — 10 月 26 日）。背景：回声纪元元年（2033）至 2036。\n\n---\n\n## 故事内核（写作时反复对照）\n\n**明面**：一个注销员调查一桩不该存在的注销。\n**暗面**：一个儿子终于要去面对母亲——而真相会把他从\"罪人\"变成\"被保护的人\"，那比当罪人更难承受。\n**第一章的第一任务**：把规矩立住，不是埋伏笔。读者读完第 1 章必须知道这六件事——①人死后有 72 小时回声 ②到期自动注销 ③注销员按键就是结束 ④续期要注销员签字 ⑤续期账单记在全网其他人的在线时长上 ⑥签字的人不下手，但也不拦。**规矩没立住之前，禁止上情绪。**\n\n**情感核弹**：第 13 章，沈砚见到母亲的回声。她给他倒水，问：\"你要不要登记？\"\n\n---\n\n## 章节规划\n\n| 章节 | 标题 | 核心事件 | 承接上章 | 章首引子类型 | 悬念钩子 | 出场人物 | 场景列表 |\n|-----|------|---------|---------|-------------|---------|---------|---------|\n| 第1章 | 注销通知 | **沈砚按规程拒绝陈素芬家属的续期申请**（规矩①-⑤在本章全部走一遍流程立住），陪完最后 72 小时并按键注销；下班打开任务队列，看到三年前就已注销的母亲档案——最近一次续期：第 1095 次，申请人签名是他 | — | 危机时刻（家属求续期） | 同一行：有人用他的名字，三年里求了 1095 次让母亲留下来，一次都没批 | 沈砚、陈素芬、陈素芬女儿（电话）、义工、清洁工、周执 | 三号注销间 / 走廊 / 电梯 / 注销处工位 |\n| 第2章 | 一千零九十五次 | 他试图关闭该任务，系统拒绝。档案室调档：母亲回声在 1095 天里有 **1095 次续期记录**，签名全是他。 | 承接章首推送 | 谜团浮现 | 他调出自己的三年出勤记录：0 天请假，0 次离开本市。而这 1095 个签名，全部发生在他\"不可能在场\"的时间。 | 沈砚、系统、档案员老韩 | 注销处工位 / 档案室 B2 / 终端室 |\n| 第3章 | 十四个小时 | 沈苓的直播间。她掉粉、掉时长，笑着讲\"算法又瞎了\"。兄妹日常，暖。 | — | 震撼对话 | 沈砚在妹妹直播间看到一条系统推送：**她本月时长回收率，全平台第一。** | 沈砚、沈苓 | 沈砚家 / 出租屋 / 线上直播间 |\n| 第4章 | 余额 | 周执的抽屉：空咖啡罐、女儿的照片、一张手写还款表。沈砚第一次听见\"回声债\"的真实机制。 | — | 重大发现 | 周执说：\"我知道是谁在用你的签名。我只是没想到——他会用三年。\" | 沈砚、周执 | 注销处办公室（深夜）/ 天台 |\n| 第5章 | 未到场 | 局长陆时衍登场，摊牌回声债是公开的秘密。沈砚拿到三年前那晚的回声日志。 | 承接章4 结尾 | 危机时刻 | 日志附页写：**申请人：沈砚（未到场）**。而\"未到场\"对应的，是他三年前提交的那张病假条编号。**他记得自己没提交过。** | 沈砚、陆时衍 | 局长办公室 / 地下档案区 |\n| 第6章 | 一个人不该签两次 | 沈砚闯入档案室想抹掉自己三年的出勤记录，发现每一页骑缝章都是同一个私人印。他撞见有人**用他的权限给一个刚死 4 小时的孩子续期**。 | 承接章5 | 背叛开场 | 屏幕上那个孩子的回声档案号是 **E-2029-1101-周小满**。三年了，这个编号一直被标记为\"已闭环\"。 | 沈砚、牧羊人（背影） | 档案室 B2 / 权限核验门 |\n| 第7章 | 小满 | 从代码注释、语音留言、监测日志里拼出牧羊人。沈砚第一次知道这个人的存在，和一个 4 岁女孩的体温 39.1℃。 | 承接章6 | 重大发现 | 语音留言里，那个声音说：\"她一直在等一个人来接她下班。\"——这句话，三年前他也对母亲说过。 | 沈砚（独白）、牧羊人（录音） | 沈砚家 / 废弃机房（潜入） |\n| 第8章 | 抄一份自己 | 沈砚试图给自己做备份，想合法留住母亲。系统判定\"权限等级不足\"。 | 承接章7 | 危机时刻 | 拒绝他的那行代码里有一句注释：**「对不起，砚哥。」** | 沈砚、系统 | 织机接入舱 / 家 |\n| 第9章 | 老郑的口袋 | 老郑登场。教沈砚用注销员身份\"签一份假注销\"。第一根稻草。 | — | 意外相遇 | 老郑口袋里那张纸条写着：**「记得你欠我一顿饭」**——他不记得是谁请的了，但他每次续期后都会重新写一遍。 | 沈砚、老郑 | 地下停车场 / 清洁工具间 |\n| 第10章 | 二十七行 | 周执坦白：父亲的回声是他亲手注销的，注销通知他写了 27 行，系统只存得下一行。友情线高点。 | 承接章9 | 情感冲击 | 周执说：\"差 400 小时。我算过，如果现在停……我女儿能等到明年秋天。\" | 沈砚、周执 | 天台 / 医院楼下 |\n| 第11章 | 值班室 | 沈砚与牧羊人第一次正面相遇，隔着一层玻璃。 | — | 震撼对话 | 沈砚问\"她为什么不走\"。对方答：\"因为她一直在等一个人来接她下班。\" | 沈砚、牧羊人 | 织机值班室 / 玻璃通道 |\n| 第12章 | 账本 | 第二幕高潮：沈砚拿到全量账本。母亲 1095 天续期的代价，是整个平台的在线时长被抽走。其中最大 ）\n> **沈砚的签名是谁在用？为什么用了整整三年？**\n\n分四层解谜，每层翻一次地基：\n\n1. **第 2 章**：1095 次续期，签名全是他 → *有人在用他的权限*\n2. **第 6 章**：骑缝章是同一个私人印 + 一个小满的档案 → *有人在偷身份，且藏了三年*\n3. **第 14 章**：回声是生前预录 → *连\"她死没死\"都要重写*\n4. **第 20 章**：牧羊人三年前就认识他 → *这不是盗窃，这是赎罪*\n\n### 支线悬念\n- **沈苓的时长去哪了**（第 3 章埋 → 第 12 章揭一半 → 第 16 章她自己说破 → 第 24 章回收）\n- **周执的 400 小时**（第 4 章埋 → 第 10 章交代 → 第 24 章结）\n- **老郑口袋里那张纸条**（第 9 章埋 → 第 24 章回响）\n- **牧羊人的真实姓名**（第 7 章埋 → 第 21 章揭示：日志里 his 全名是\"周正清\"——周执的父亲？——**不，他只是姓周。这是第 21 章的最后一句反转。**）\n\n### 终极揭秘\n> 沈砚这三年之所以能\"活得像个正常人\"——他的记忆里那些越来越大的空白、他对时间的钝感、他说不清自己什么时候开始这么累——不是因为他在逃。\n> 是因为**回声债一直在从他身上扣**，而他本人毫不知情。\n> 他不是被抛弃的儿子，他是**一直在替母亲上班的活体服务器**。\n> 而牧羊人用三年时间做的唯一一件事，就是让他不必发现这件事。\n\n---\n\n## 设定词典\n\n> 新名词首现时，必须给读者一个**可感知的线索**（一个动作、一个人为反应、一个反常识的数字），不要用定义句解释。\n\n| 名词 | 首现章节 | 读者已知（首现时） | 完整真相 | 计划揭示 |\n|------|---------|-------------------|---------|---------|\n| 织机（Loom） | 第 1 章 | 全世界的神经信号网络，像一张会呼吸的网 | 它同时是回声的载体和回收的执行者——收的是人，不是机器 | 第 12 章 |\n| 回声（Echo） | 第 1 章 | 人死后 72 小时的\"投影\"，能对话，有脾气 | 不是死后提取，是生前预录；也不是全部，只是被授权的那部分 | 第 14 章 |\n| 回声纪元 | 第 1 章 | 从 2033 年起算，所有人的人生都从这一年重新计 | 它从第一天起就是个被包装过的实验 | 第 14 章 |\n| 注销员（EDO） | 第 1 章 | 专门送回声走完最后一程的人，体制内，很体面 | 全称是\"回声删除执行者\"，他们签的字就是死亡证明 | 第 4 章 |\n| 注销通知 | 第 1 章 | 一张纸，写给回声的最后一句话 | 它的存在意义不是通知，是**留痕**——留谁的痕，是全书最大的反转 | 第 18 章 |\n| 续期（Extension） | 第 2 章 | 延长回声存在的申请，需要注销员签名 | 1095 次续期，是全书的核心谜题 | 第 6 章 |\n| 回声债（Echo Debt） | 第 4 章 | 一句老生常谈的抱怨，说回声很费电 | 运行回声消耗的算力，等量扣减**活人的在线时长** | 第 4 章（明）/ 第 12 章（账） |\n| 时长余额 | 第 4 章 | 周执桌上的还款表，他每月还一点 | 是每个人可被回收的在线时长额度，住院儿童最便宜 | 第 12 章 |\n| 权限签名（Sign-off） | 第 2 章 | 注销员的一次性授权令牌，签了就生效 | 可以被复制、被借用、被一个人连续用三年 | 第 6 章 |\n| 探视间 | 第 1 章 | 回声家属能见面的地方，有玻璃，像探监 | 三年来沈砚一次都没来过 | 第 13 章 |\n| 骑缝章 | 第 6 章 | 档案页上的一个私印，用来证明没撕过页 | 全城的档案骑缝章，三年来都是同一个人的 | 第 6 章 |\n| Shep（牧羊人） | 第 7 章 | 一个代号，签名档里查不到 | 回声纪元早期架构搭建者，周正清 | 第 21 章 |\n\n---\n\n## 章节摘要\n\n### 第 1 章：注销通知\n家属院修拉链的陈素芬，72 岁，公交售票员退休二十六年。她的回声已经醒了三天，记得自己已经死了，也一直没说。女儿第六趟赶来求续期二十四小时，沈砚按规程拒签——「谁的签字都不行，只看窗口」。他顺口把话说透：续期不是免费的，账记在全网，抽的是那些正在上班、上课、直播、不会有人问的一小时。「签字的人不下手，但是签字的人也不拦。」陈素芬评了一句：「你们以为自己在做坏事，其实你们只是把坏事办完了。」最后两小时，她看出这个年轻人是来躲的，沈砚没有否认。到点他按下那个键，系统响了一声，杯子落回桌上，水晃出一圈。走廊里，清洁工问他今天几个，他说三个半。回到工位，他在队列最底下看见三年前的条目：E-1109-林秀云，已注销——最近一次续期第 1095 次，申请人签名沈砚。档案显示三年前那晚没有人按键，系统自己到点关的。而沈砚记得自己没签过，也记得自己那天没有去。章末他没去泡咖啡、没去看下一份待办，走进电梯，按的不是负一。\n\n---\n\n### 第 2 章：一千零九十五次\n沈砚试着关闭任务，系统三次拒绝，第三次弹出的提示是\"该回声已归档，无操作权限\"。他去 B2 档案室调档，看见母亲的名字后面跟着一列续期记录——一天不落，1095 条，签名栏全是\"沈砚\"。他调出自己的三年出勤记录：0 天事假，0 次外勤，0 次离开本市。而这 1095 条签名，全部发生在他\"不可能在场\"的时间段。老韩说，\"小子，你三年没休过一天。\"沈砚说，\"我知道。\"——他说这句话的时候，第一次觉得有点冷。\n\n### 第 3 章：十四个小时\n沈苓的直播间。标题是\"第 412 天挑战\"。她讲自己又掉了一千粉，讲算法又瞎了，讲观众骂她菜，她都笑着。哥妹俩视频，妹妹往哥碗里夹肉，说\"哥你吃点东西啊\"。挂断前她说明天播十四个小时。挂断后，沈砚在她的直播间页面停留了很久——他看到一条系统推送，不该出现在普通观众页面上的推送：**该主播本月时长回收率：全平台第一（31.2%）**。他关掉页面，走到窗边，发现自己在数妹妹这几天一共掉了多少小时。\n\n### 第 4 章：余额\n深夜的注销处办公室。周执的抽屉：七十二个空咖啡罐，一张女儿的照片，和一张手写还款表。沈砚第一次听见回声债：运行一天回声，等量扣减活人的在线时长。周执说得像在念别人的账：\"住院的最便宜，小学生第二便宜，加班的第三贵。\"他知道扣的是谁。他从不说。沈砚问他知不知道谁在用他的签名。周执把咖啡放下，说：\"我知道。我只是没想到——他会用三年。\"然后他加了句：\"这单我不接。\"\n\n### 第 5 章：未到场\n陆时衍摊开回声债的完整账目，不藏不瞒。他念完一串数字，沉默两秒。沈砚问了三年前那晚的回声日志。陆时衍给了，附页写着一行字：\"申请人：沈砚（未到场）。\"沈砚看着\"未到场\"三个字，认出那是他三年前提交的一张病假条编号。他记得自己没有提交过。他记得那天他在考场。陆时衍送他出门时说：\"数字不会撒谎。人会。你回去慢慢想。\"\n\n### 第 6 章：一个人不该签两次\n沈砚回到 B2，想抹掉自己三年的出勤记录——他以为自己毁证，其实是想证明自己从没到场。他发现每一页的骑缝章都是同一个私人印，全城档案，三年来都是同一个人的。他一路追到权限核验门，门开了一条缝。他看见里面有人背对着屏幕，正在给一个刚死四小时的孩子做续期。屏幕上跳出一行：**E-2029-1101-周小满**。状态栏写着\"已闭环\"。沈砚的手按在门框上。他四年来第一次想打人。\n\n### 第 7 章：小满\n沈砚顺着代码注释往回爬，拼出一个人：早期架构搭建者，代号 Shep，签名档查不到。第 11 层代码里有一句注释：\"她今天说不想睡。\"第 34 层有体温记录：39.1℃，最后一条。他潜入织机的一个废弃机房，在硬盘里找到十一段语音留言。前十段都是技术讨论，语气冷静。第十一段只有一句：\"她一直在等一个人来接她下班。\"沈砚坐在地上很久——三年前，他自己对母亲说过一模一样的话。\n\n### 第 8 章：抄一份自己\n沈砚做了一个疯狂的决定：给自己做一份备份，走正规流程，然后合法地、光明正大地把母亲留下来。系统在他提交申请的第 0.4 秒返回拒绝：**权限等级不足**。他去查理由，查不到——理由栏是空的。他不甘心，又试了一次，第二次他看到了系统在日志里自动生成的一句注释，不是给他的，是给写代码的人看的：**「对不起，砚哥。」**\n\n### 第 9 章：老郑的口袋\n沈砚在地下停车场遇到夜班清洁工老郑。一个干了十九年、口袋里永远有一张纸条的人。老郑说自己是\"全世界第一个自愿回声\"，理由写的是\"想多陪女儿几年\"，价钱是把自己的四年时间全押进去。沈砚问他纸条上写的什么。老郑掏出来，笑了：\"记得你欠我一顿饭。\"沈砚愣住了——他不记得请过。老郑说：\"没关系，我每次续完都忘，我下次再写一遍。\"\n\n### 第 10 章：二十七行\n周执终于说了他父亲的事。注销那天他写了 27 行，系统只存得下一行，那一行是\"同意\"。他说他后来又申请了 30 次，系统一次都没回。他还说了一个数字：他女儿今年要做手术，他每月还一点时长余额，两年了，还差 400 小时。沈砚问他有没有想过不等了。周执看着窗外：\"如果现在停……她能等到明年秋天。\"\n\n### 第 11 章：值班室\n沈砚用老郑教的假注销签进了织机值班室。牧羊人没有回头。两个人隔着玻璃，一个在里面一个在外面，聊了四十分钟，全是数字。沈砚问：\"她为什么不走？\"对方答：\"因为她一直在等一个人来接她下班。\"沈砚说，那个人是我。对方说：\"我知道。所以我才没让她走。\"\n\n### 第 12 章：账本\n沈砚拿到全量账本。母亲 1095 天的续期，代价是 4.7 亿小时被抽走——其中 38% 来自一个不到百万粉的小平台。沈苓的 11 万粉丝，就在那个平台里。他把账本合上，手在抖。当晚沈苓发了条视频：\"哥，我今天播了十四个小时，我想明白了，不是我的问题，是他们的问题。\"她说得很轻松，还配了段欢快的音乐。\n\n### 第 13 章：登记\n沈砚申请了探视间 3-C。三年第一次。母亲坐在一张堆满纸的桌子后面，正在给一份社区名单做登记。她给他倒水，问\"你要不要登记\"。她看上去瘦了，但比照片里还好看一点。沈砚说了很多话，唯独没说她已经死了——他不知道怎么开口。她也不说。她递给他一张纸：**「沈砚，男，34 岁。不良记录：无。」**是他自己的名字，是她的字。\n\n### 第 14 章：她在确诊那天\n沈砚回到 B2 最深层，去找母亲回声的原始档案。技术文档里写着：\"回声权重提取于签署时刻，非死亡时刻。\"他往下翻，翻到 2032 年 3 月 17 日——母亲确诊阿尔茨海默的那一天。录制人一栏：\"林秀云（本人）\"。备注栏六个字：\"我怕忘了你们。\"回声纪元不是死后才有的东西。它从一开始就是一个给活人准备的抽屉。\n\n### 第 15 章：换我\n牧羊人摊牌：只要沈砚替小满签一张注销通知，他就把全部权限交出来，包括回声债的全部账本。沈砚拒绝了。走出值班室，他在楼梯上站了很久，又回去了。他说：\"你算过吗。\"对方说：\"算过。你签一个四岁的，我放一个六十八岁的。你自己算。\"\n\n### 第 16 章：你在偷我的时间\n沈苓终于崩了。她说她每天醒来记不清自己做过什么，说她上周有一天完全想不起来。她问：\"哥，你是不是也觉得我不够努力？\"沈砚张了张嘴。沈苓先笑了：\"行啦，我知道，我菜。\"然后她挂了电话。沈砚对着黑屏坐了二十分钟。他有三次机会说出真相，三次都没说。\n\n### 第 17 章：陆时衍的方案\n陆时衍把四个选项全摊在桌上，包括最狠的那个：彻底公开回声债，让每个人自己选要不要让亲人留下。他说代价是所有人都会恨回声局，也包括所有回声。沈砚问他：\"那你选哪个？\"陆时衍说：\"我选数字不会撒谎的那个。\"念完数字，他沉默了两秒。\n\n### 第 18 章：签\n沈砚给自己发了一张注销通知——不是死亡，是**停止为她续期**。系统拒绝，理由是签字人\"不在场\"。他站在接入舱前，突然想起三年前那晚他去过。他不是没去。**他到了**，他站在织机大楼外的玻璃前，看着母亲的回声在里面活到第 72 小时，然后系统自动注销，而他站在外面，什么都没做。\n\n### 第 19 章：在场的证据\n保安室的老韩翻出了三年前那晚的监控。存了 6 小时 11 分。画面里是沈砚：22 岁，站在大楼对面的公交站牌下，从 20:47 站到 03:12。然后他走了——因为第二天他有考试。监控后面补了一条：第二天他回局里上班。第三天他才提交病假条，理由是\"家中有事\"。老韩说：\"不交假条，进不了门。\"沈砚点点头。他一直是这么活的。\n\n### 第 20 章：他为什么帮你\n沈砚回到值班室，牧羊人终于转过脸来。三年前他就认识沈砚——不是档案，是那天楼下的监控。三年前牧羊人路过大楼，看见一个二十二岁的人在外面站了六个小时。他当时正在给自己的女儿续期，手里有一个刚偷来的签名。他把签名用在了沈砚身上。沈砚说：\"为什么。\"对方说：\"我没救你。我只是不想看见有人在你这个年纪，就把自己判完了。\"\n\n### 第 21 章：39.1℃\n牧羊人交出全部权限，打开小满的窗口。四岁的女孩跑出值班室，回头说了句\"爸爸再见\"。周正清坐在椅子上，把工单写完，最后一栏备注：\"成本我出。——这次是最后一次，出的不是别人的。\"他的体温降下来的时候，日志上最后一条记录停在 39.1℃。沈砚在日志底部看到签名档里的全名：周正清。他愣了一下：姓周。\n\n### 第 22 章：回收\n清算开始。48 小时，全城被抽走 9.1 亿小时。有人在便利店买了两次同样的东西而不记得，有人在地铁上坐过了站，有人的孩子三天没说出完整的句子。周执在医院陪女儿，他把还款表折起来放进口袋。陆时衍在全局广播里把话说完了，一个人坐在空掉的大厅里。沈砚在织机里看着所有回声一个一个熄灯，一个都没有喊疼。\n\n### 第 23 章：第七十二小时\n沈砚陪母亲走完最后 72 小时。他一句话没说，只是一张一张把她三年来登记的东西念给她听：邻居的狗、停水的三楼、收废品的老头、她自己。他说得嗓子哑了。她说\"记下了\"。最后一小时，她第一次问他：\"你今天吃饭了吗？\"他说：\"吃了。\"他没有。\n\n### 第 24 章：下班\n回收的时长开始返还，缓慢地，像解冻。沈苓的直播间第三天涨了两千粉，她发了条视频说\"算法好像想通了\"。周执攒够了 400 小时，那天下午他在大楼门口等，手里拎着两罐咖啡，一罐给沈砚，一罐给老郑。沈砚走出来。老郑在擦台阶，口袋里那张纸条被风吹出来。沈砚捡起来，看见了自己熟悉的一笔字。**他知道是谁请的了——是他自己，上一次轮回。**天亮了。\n"}, "chars": {"body": "# 人物档案 · 《注销通知》\n\n> 本档案为写作直接依据。每个角色的性格核心、致命缺陷、说话风格必须具体到可直接指导对话与场景的程度。\n> 铁律：**每个人的每一句台词，都应该让读者听得出\"这是他说的\"。**\n\n---\n\n## 主角\n\n### 沈砚\n\n- **年龄/职业**：34 岁，回声事务局注销处三级注销员（EDO / Echo Deletion Officer）。工龄四年，签发注销通知 1,217 份，从未出过差错。\n- **外貌特征**：瘦。制服是均码，穿在身上肩线塌下去一截，显得整个人被衣服挂着。左手虎口有一层薄茧（不是握笔的茧，是长期戴权限手套磨的）。左眉尾一道极淡的疤，小时候留的。眼睛下方常年一层洗不掉的青灰。指甲剪到贴着肉——职业习惯，因为签字时不能让指甲刮到纸。手非常稳，比他自己以为的稳得多。\n- **性格核心**：**职业性的温柔**。他能对一个素不相识的、已经死了两天的老人，做到全程不冷脸、不催促、递水时用双手。所有人都说沈砚这人真好。但所有这些温柔都停在工作半径之外——出了那个门，他是一台关掉了回应的机器。\n- **核心价值观**：让告别有个体面的结束。他真心认为：每个人都应该能决定自己什么时候、以什么方式被忘记。这是他选择这份工作的原因，也是他唯一说得出口的理由。\n- **最大恐惧**：被人善待。比任何东西都怕。别人对他温和，他就得回答\"我最近怎么样\"，而这个问题的正确答案是\"我在逃\"，他答不出口。\n- **致命缺陷**：**过度合理化**。他能给任何事找到无懈可击的理由，包括逃避。三年前那晚他没去送母亲最后一程，他给自己的解释是\"那天我有考试\"——一个三年前他就没信过、却用了三年没换的说法。他不撒谎，他只是**存心让自己的谎言听起来合理**。\n- **内心渴望**：他渴望有人告诉他\"那不是你的错\"。但更深的地方，他其实更渴望有人告诉他\"那是你的错\"——因为那至少是一个他能承担、能赎的答案。而三年里，他收到的所有同情都是前一种，每一种都让他更想消失。\n- **背景故事**：\n  - 12 岁，母亲改嫁。继父姓林，母亲改名叫林秀云。沈砚跟父亲姓，没改。\n  - 14 岁，父亲走了。母亲没哭，只是一样一样给他收拾行李。收拾完她在墙上贴了一张纸，写着\"沈砚的衣服：一件 蓝、一件 灰、一件 白\"。她这辈子都在给东西登记。\n  - 母亲做过三十一年社区档案员，退休后帮街道做纸质登记。别人都笑她，说这活儿几千年前就有。她说：\"纸会烂，但它不会骗人。\"\n  - 2032 年 3 月，母亲确诊早发性阿尔茨海默，早期。她是全网第一批自愿备份者之一。那天上过新闻，记者问她为什么。她说：\"我怕到时候忘了你们长什么样，也怕忘了我自己是谁。\"\n  - 2032 年 10 月 9 日，林秀云去世，68 岁。回声纪元元年，那一夜她的回声第一次上线。\n  - 那晚沈砚在外地，正在考场。系统给他推了一条通知，他没点开。第二天早上他才看见。\n  - 回声窗口只有 72 小时。第二天他收到一条消息：**《续期申请已驳回》**，申请人签名栏写着\"沈砚\"。\n  - 他记得自己没有签过。\n  - 他也记得自己没有去查。\n  - 三年，一千零九十五天。\n- **说话风格**：短句，几乎不用形容词。回答问题之前会有一个很短的停顿，像在确认自己是不是真要说。紧张时话会变得更少、更完整——像在写公文。极少说\"我\"，极少说\"对不起\"。他表达在意的方式是**动手**：替你把水倒满，把你的鞋带解开，把你门口的东西摆正。\n- **口头禅**：「知道了。」「还剩多久。」（他从不问\"怎么了\"，只问时间）\n- **MBTI**：ISTJ（高压下的自我怀疑版本）。别人都以为他是 INFJ。\n\n---\n\n## 反派\n\n### 陆时衍\n\n- **年龄/职业**：46 岁，回声事务局局长。\n- **外貌**：偏瘦，戴一副细框眼镜，说话时习惯低头看对方胸口而不是眼睛。不是傲慢——是在读对方的编号。\n- **性格核心**：**制度性的诚实**。他从不撒谎，也从不隐瞒数字。他把所有坏消息都摊在桌上，然后请所有人签字。这比撒谎可怕得多。\n- **核心价值观**：时间是有限的社会资源，必须有定价和配额。他相信把分配规则说清楚，比藏着掖着对所有人更公平。\n- **致命缺陷**：**把统计当道德**。当数字足够小的时候，他就看不见具体的人。他能在会上念出\"本季度回收时长 4.7 亿小时\"而面不改色，却不会记得任何一个人的名字。\n- **他不是恶人**：他手里握着\"回声债\"的完整真相。他推动回声税，是在一堆死路里找一条不流血的。他之所以反派，不是因为他想害谁，是因为他**愿意接受\"由最穷的人承担\"这个答案**。\n- **恐惧**：被叫作刽子手。他最怕的不是良心发现，是良心发现之后发现自己也无力改变。\n- **说话风格**：像在念一份工单，条理清晰，绝不带情绪。他会说：\"我不是在说服你。我是在告诉你数字。\"——但他会在念完数字后，沉默两秒。\n- **口头禅**：「数字不会撒谎。人会。」\n\n### 牧羊人（代号 Shep）\n\n- **年龄/职业**：约 35 岁。回声纪元早期架构搭建者之一，姓名不详，现身份注销。实际掌握着比回声事务局更高一层的权限。\n- **性格核心**：**对着仪表盘谈感情的人**。他从不谈感情，只谈损耗比。但工单上那些本该是纯数字的地方，会出现体温——39.1℃。那是他女儿小满最后一次体温记录。\n- **核心目标**：让回声**不可逆**。72 小时的死亡闸门是他全部工作的靶心，因为小满在那道闸门前被关掉了。\n- **动机不是权，是舍不得**。2029 年回声纪元元年第一场事故，他的女儿周小满，4 岁，死在织机的第一次大规模上线测试里。官方记录是\"信号冲突导致的人格解离\"。他不信这个。他用三年时间爬到能改闸门的位置，用权限把她捞回来，然后发现闸门不是一次性的，只要有人签名，就能一直开。\n- **致命缺陷**：他真心认为\"爱一个具体的人\"足以正当化对所有人的伤害。他不认为自己在作恶，他认为自己只是在**挪一点别人的电**。\n- **恐惧**：被注销员按流程\"送走\"。他最怕的不是死，是他女儿被一份文件结束。他躲了三年，最后败给的正是他自己最怕的那个流程——只是签字的是别人。\n- **说话风格**：极简，从不寒暄，从不解释动机。对话里大量使用数字和单位。他会关心你的睡眠时长，然后立刻把它记进一个表。\n- **口头禅**：「成本我出。」（他每次说这句话，代价都落在别人身上）\n- **与沈砚的关系**：他认识沈砚，比沈砚认识他早三年。\n\n---\n\n## 配角\n\n### 周执\n\n- **年龄/职业**：41 岁，沈砚的同事，同为 EDO，工龄九年。全处出勤纪录第二。\n- **外貌**：永远拎着一杯罐装咖啡走位，抽屉里堆着空罐，桌上有一圈洗不掉的杯印。人看着比实际年龄老十岁。\n- **性格核心**：嘴上什么都不在乎。实际上，他是全处唯一一个会替回声家属写回信的人。四年 1,300 多封信，那些信他一封不落地自己寄出去。\n- **动机**：他要攒够\"时长余额\"离职，去接女儿。他女儿周棠，7 岁，先心病，每季度复诊。他算了两年，还差 400 小时。\n- **他知道什么**：他知道回声债扣的是谁的时长——直播观众、小学生、加班的人。他也知道那些是活生生的人。他从不说，因为说了也没用，而且说了他走不成。\n- **说话风格**：贫嘴，什么都能聊两句。但沈砚注意到，他从不拿别人的事开玩笑。口头禅：「这单我不接。」「先活着再说。」\n- **秘密**：他自己的父亲是回声，被他亲手注销。注销通知上他写了 27 行，官方系统只能存 1 行。那 1 行是\"同意\"。\n- **与沈砚的关系**：全处唯一可能相信他的人，也是全处唯一一个从不问他\"你还好吗\"的人——因为周执知道问了会得到一个礼貌的假答案。\n\n### 沈苓\n\n- **年龄/职业**：26 岁，沈砚的妹妹。小平台游戏主播，粉丝 11 万。\n- **外貌**：镜头前妆很浓，下播后不卸，眼睛红。像她哥，眼睛下面那层青灰是遗传的。\n- **性格核心**：**硬撑型乐观**。她的直播间标题永远写着\"第 N 天挑战\"。她会笑着讲自己又掉了一千粉，笑着说\"算法又瞎了\"。\n- **她的处境**：她不知道自己每个月有 30 小时在线时长被回收。她把这归因于自己不够努力，于是把直播时长从每天 6 小时压到 10 小时想补回来——回收率随之上升，于是掉得更快。这是一个她永远解不开的死循环。\n- **她是全书最锋利的那把账**：她的时间在喂沈砚的母亲。她不知道。\n- **与沈砚的关系**：崇拜他。全家人都觉得哥是全世界最靠谱的人。她从来不知道哥这三年在躲什么。\n- **说话风格**：语速快，句子短，发语音永远一大段连着说。\"哥你吃点东西啊\"——她一天要说三遍。\n- **口头禅**：「我没事。」「我今天播了十四个小时。」\n\n### 林秀云（沈砚的母亲）\n\n- **生卒**：1935—2032。社区档案员，三十一年。\n- **外貌**：瘦小，永远穿一件枣红色的旧外套。手背上有一道常年握笔磨出来的硬茧。\n- **性格核心**：**温和的固执**。她从不发火，她只是坚持。她说\"我记下来了\"的时候，那是一个陈述句。\n- **回声特征（关键设定）**：她记得所有事，包括不存在的。她给每个来访的人倒水，问\"你要不要登记\"。她**从来没有说过自己死了**——三年，一千零九十五天，她一直在里面做登记，等她儿子来接她下班。\n- **她是全书最大的情感核弹**：她根本没走成，因为有人不肯让她走。而沈砚以为，是自己签的那行字把她关掉的。\n\n### 周棠（周执的女儿）\n\n- 7 岁，先心病。全书出场 3 次，每次不超过半页。不说话。\n- 存在方式：她躺在第 11 层的儿童病房里，那层楼没有窗，因为回声债优先回收的是\"非必要活动时长\"——住院儿童的时间是最便宜的。\n\n### 小满（周小满，牧羊人的女儿）\n\n- 4 岁，2029 年死于回声纪元元年第一起事故。\n- **全书从不正面出场**。只以代码注释、语音留言、监测日志、体温读数（39.1℃）的形式存在。\n- 但结局由她决定。\n\n### 老郑\n\n- **年龄/职业**：56 岁。回声事务局夜班清洁工。干了十九年。\n- **真实身份**：全世界第一个自愿回声。2029 年确诊绝症，自己录的备份，理由写的是\"想多陪女儿几年\"。他自己开的价，是把自己的四年时间全押进去。\n- **特征**：他每次续期后会忘记一些东西，但他永远记得要在身上留一张纸条。他口袋里永远有一张。\n- **功能**：沈砚的行动支点。他教沈砚怎么用注销员的身份，签一份假注销。\n\n---\n\n## 关系图（谁在为谁付账）\n\n```\n          小满（4岁，已死1095天）\n                    │\n              牧羊人 ──续期1095次──► 林秀云（68岁，已死1095天）\n                    │                      ▲\n              盗用签名                     │ 三年\n                    │                      │\n                    └──► 沈砚 ◄──愧疚────────┘\n                              │\n                    回收时长 ──┴──► 沈苓（26岁，游戏主播）\n                              │\n                              └──► 周棠（7岁，住院，窗都没有）\n                              └──► 全平台 4.7 亿小时/季\n                              └──► 周执（差 400 小时）\n```\n\n**一句话概括全局**：沈砚以为他欠母亲一条命；实际上，是有人在替他还，并拿全世界的电付账。\n"}, "style": {"body": "# 《注销通知》文风基准\n\n> 本文件是全书的文风宪法。每一章动笔前先扫一眼，写完后再回来对照检查。\n> **判定标准**：如果某一章读起来像\"另一个作者写的\"，就是文风跑偏了。\n\n---\n\n## 一、文风指纹\n\n| 维度 | 目标 |\n|------|------|\n| **对话占比** | 38%–44%（对话是本书的主干，叙述是骨架） |\n| **句子节奏** | 短句为主。单句均值 ≤ 18 字。动作段单句 ≤ 10 字。禁止出现超过 35 字的叙述长句 |\n| **段落呼吸** | 每段 1–4 行。连续叙述不超过 3 段，第 4 段必须是对话或独立成段的动作 |\n| **叙述距离** | 贴脸第三人称限制（严贴沈砚）。**沈砚看不见的东西，读者也不许先知道**——包括全知旁白、上帝视角、\"后来才知道\"式的前置剧透 |\n| **描写倾向** | 克制。全书形容词密度控制在每百字 ≤ 4 个。情绪不靠形容词，靠**动作和物件** |\n| **情绪最高点** | 始终压在水面下。不允许一章里出现两次以上\"心口一疼\"\"鼻子一酸\"。人物越痛苦，句子越短 |\n\n### 五个硬指标（每章自检）\n\n1. **开篇 200 字内必须有动作或对话**，禁止天气、禁止背景铺垫、禁止回顾\n2. **新名词首现必须给可感知线索**，不许用定义句（详见设定词典）\n3. **每章结尾必须是钩子**，且钩子必须是**具体物或具体动作**，不能是抽象感慨\n4. **每章至少 1 处\"展示而非讲述\"** —— 把情绪换成一个动作、一件物品、一句没说出口的话\n5. **沈砚的台词**：短、完整、无形容词。**全书禁止沈砚说超过 20 字的台词**\n\n---\n\n## 二、基准段落\n\n### 范例 A · 沈砚视角（专业温柔 + 深层麻木）\n\n> 注销间的灯是两盏，可调的。现在调到最暗那一档。\n>\n> 桌上两杯水。沈砚那杯没动过。他坐得笔直，手放在膝盖上——标准姿态，四年练出来的，看起来像在听课。老师傅说这是敬业，他说这是习惯。习惯和不紧张是两件事。\n>\n> 对面的老人把杯子握在手心里，指头很粗，指甲剪得很短。她讲她老伴，讲了大概六遍。前五遍他都在听。第六遍他也在听。\n>\n> \"他走了十二年了，\"她说，\"今年该轮到我领低保了。\"\n>\n> \"嗯。\"沈砚说。\n>\n> 老人笑起来。回声的笑和活人不一样——活人的笑是往上走的，回声的笑是**回来的**，像一段被录好的东西又播放了一遍，起点比终点高一点点。\n>\n> 他看了一眼手腕。屏幕上还有一小时四十分钟。\n>\n> \"您还有想说的吗？\"他问。这句话他每天说四遍。四个小时下来，四个注销间，他一共问了三十二遍。每一遍他都听得很认真。\n>\n> 他不是装的。装不了这么久。\n>\n> 老人想了想，说：\"小同志，你说人死了以后……会不会有人记得我？\"\n>\n> 沈砚没有立刻回答。他在心里过了一遍标准话术——\"您的音容笑貌会被妥善保存\"——这句话他一年要说八百遍，说到自己都信了。\n>\n> 他今天说的是另一句。\n>\n> \"会。\"他说，\"至少今天有人记得。\"\n>\n> 老人点点头，低头看杯子。杯子里的水凉了她也没发现。\n>\n> 沈砚把记录板上的时间改了一下。他多给她留了二十分钟。\n>\n> 这不算违规。二十分钟的偏差，系统会记在核验员头上。而核验员这一栏，永远是他自己的名字。\n\n**这段在示范什么**：\n- 全部情绪靠动作承担——\"杯子里的水凉了她也没发现\"\"他多给她留了二十分钟\"\n- 沈砚破了一次例，例外本身比台词更重要\n- \"回声的笑是回来的，起点比终点高一点点\" —— 一句话建立一个世界观\n- 短句、贴脸、无形容词、贴脸第三人称\n\n---\n\n### 范例 B · 陆时衍视角（制度性的诚实）\n\n> \"第四季度，回收时长 4.7 亿小时。\"陆时衍念完，把眼镜往上推了推，\"折合人均每周 22.6 分钟。这是我要说的全部。\"\n>\n> 没人说话。\n>\n> \"我知道你们想听什么。\"他说，\"你们想听我说我们在控制，在优化，在找办法。我都可以说，但说了对你们没用，对那 4.7 亿小时更没用。\"\n>\n> 他把手里的纸翻了一面。纸很薄，翻过去的时候有声音。\n>\n> \"分配规则贴在公告栏里，公示期一百八十天，任何人可以提异议。我不隐藏任何数字。\"他停了停，\"我不是在说服你们。我是在告诉你们数字。\"\n>\n> 沈砚看着那张纸的背面。背面是空的。\n>\n> \"陆局，\"他说，\"住院儿童那部分，为什么排在第一优先回收？\"\n>\n> \"因为他们最便宜。\"陆时衍说得很平，\"住院儿童的非必要活动时长，可回收比例是常人的三倍。他们不是在直播，不是在上班，不是在打游戏。他们在等。\"\n>\n> 他把纸放下。\n>\n> \"你觉得这很脏。我知道。\"他说，\"但你告诉我，一个不用脏的办法 costing 什么？我算过。第九版方案的核心假设是回声总量在两年内下降到 0.3%。实际是 4.7%。我念给你听的是第几版你知道吗？\"\n>\n> 沈砚知道。第九版。\n>\n> \"十四版。\"陆时衍说，\"数字不会撒谎。人会。但数字也不够用。所以我才站在这儿。\"\n>\n> 他停了两秒。\n>\n> 这两秒不在他的稿子里。\n\n**这段在示范什么**：\n- 反派不是靠\"坏\"写出来的，是靠\"他说的每一句都对，但结论他接受\"写出来的\n- \"等待的两秒不在稿子里\" —— 全书的情感只能这样放进去\n- 数字就是这本书的修辞，不需要翻译成形容词\n\n---\n\n## 三、负面清单（AI 写作痕迹清除）\n\n以下写法**每章禁止**：\n\n| 禁止 | 正确做法 |\n|------|---------|\n| 沈砚\"心中五味杂陈\" | 写他把手放在门框上，指节发白 |\n| 描述角色的心理活动超过两行 | 一句心理 + 一个外部动作，立刻结束 |\n| \"他知道，这只是开始\" | 直接写下一件事发生 |\n| 每段开头用人物名 | 用动作、声音或物件起头 |\n| \"不禁\"\"仿佛\"\"似乎\"连用 | 删掉，让句子直说 |\n| 环境描写超过 3 行且不带信息 | 删到 1 行以内，或让它携带信息（如\"灯调到最暗那一档\"） |\n| 沈砚用抽象词表达情绪（痛苦、愧疚、释然） | 换成具体行为 |\n| 对话前后加\"他淡淡地说\"\"他冷冷地说\" | 删掉，靠台词本身区分人 |\n| 章末用感慨收尾 | 章末必须是物、动作或信息 |\n| 解释读者已经能推断的东西 | 删 |\n| 排比句用于抒情 | 排比只用于**机构发言**（陆时衍、制度文本） |\n\n---\n\n## 四、沈砚台词红线\n\n- 单句 ≤ 20 字\n- 不使用\"我\"开头超过 2 次的段落\n- 紧张时省略主语和助词\n- 从不说\"对不起\"，全书一次都没有——这是他最核心的说话特征，第 23 章第一次说出口\n- 表达关心 = 动手（倒水、解鞋带、把东西摆正）\n\n---\n\n## 五、本书校准段落\n\n> （初始为空。第 1 章完成后由 Phase 3 回填实际写法，作为后续章节的比对基准。）\n\n---\n---\n\n## 六、第一章专属规则（血泪教训，最高优先级）\n\n> **这一节的规则高于上面所有规则。**\n\n### ❌ 犯过的错（不要重犯）\n\n初版第一章 3672 字，读者反馈**「看不懂」**。诊断结果：\n\n1. **把设定写成段落**——「回声纪元三年。织机上线三年了。」然后整段解释。读者读了 20 轮对话才知道这是科幻。\n2. **冷到没有温度**——为了执行「形容词≤4/百字」「情感压在水面下」，把老太太讲老伴那段最暖的戏，用「这声音他听了四年」摁死了。\n3. **自欺欺人的机器病**——写了「公共交通 retired. 不对。是\"退休\"」，试图模拟真人打错字，实际效果是**读者觉得作者有毛病**。\n4. **钩子需要前情才懂**——钩子是「一个已注销的回声出现在队列里」，而读者当时连「回声」是什么都刚知道。\n\n### ✅ 第一章的铁律\n\n| 规则 | 说明 |\n|------|------|\n| **规矩用演，不用讲** | 六条规矩必须在**同一场戏里走完一整轮完整流程**（有人求续期 → 拒签 → 陪完 → 按键 → 人消失）。禁止出现任何独立于场景的设定讲解段落。 |\n| **规矩未立，禁上情绪** | 读者还没搞懂这个世界之前，任何情感冲击都会被当成信息噪声吞掉。先交付规则，再交付情绪。 |\n| **前因靠行为立，不靠回忆** | 沈砚第一章必须**亲手拒签一次**。读者亲眼看见「签字是有分量的」，前因就立住了——不需要任何回忆插叙。 |\n| **钩子必须是动作，不能是编号** | 「档案里有个 ID」是信息钩，「他按了电梯不是负一」才是情绪钩。**两个都要**，但情绪钩必须放在最后一行。 |\n| **禁止自我纠错句式** | 任何「不对。是……」「其实应该是……」的自我改写一律删除。这是机器味最重的特征。 |\n| **核心术语必须首现即立** | 「续期」是全书核心冲突，第一章必须出现两次：一次规则演示，一次章尾钩子。 |\n\n"}, "plan": {"body": "{\n  \"version\": 1,\n  \"novelName\": \"注销通知\",\n  \"projectPath\": \"./chinese-novelist/20261015-113633-注销通知\",\n  \"totalChapters\": 24,\n  \"minWordsPerChapter\": 3000,\n  \"createdAt\": \"2026-10-15T11:38:27\",\n  \"updatedAt\": \"2026-10-15T14:58:00\",\n  \"status\": \"in_progress\",\n  \"writingMode\": \"serial\",\n  \"chapters\": [\n /* Markdown → HTML（只保留正文用得到的语法） */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function md(src){
  const L0 = src.replace(/\r/g,"").split("\n");
  const out=[]; let i=0, code=false, buf=[], list=null, lt=null;
  const flush=()=>{ if(list){ out.push(`<${lt}>`+list.map(x=>`<li>${inline(x)}</li>`).join("")+`</${lt}>`); list=null; lt=null; } };
  while(i<L0.length){
    const L=L0[i];
    if(/^```/.test(L)){ flush(); if(!code){code=true;buf=[];} else {out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);code=false;} i++; continue; }
    if(code){ buf.push(L); i++; continue; }
    if(/^\s*$/.test(L)){ flush(); i++; continue; }
    if(/^\s*(?:[—–]{2,}|[-*_]{3,})\s*$/.test(L)){ flush(); out.push("<hr>"); i++; continue; }
    if(/^\s*\|/.test(L) && /^\s*\|[\s:|-]+\|/.test(L0[i+1]||"")){
      flush();
      const c=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      const hd=c(L); i+=2; const rows=[];
      while(i<L0.length && /^\s*\|/.test(L0[i])){ rows.push(c(L0[i])); i++; }
      out.push(`<div class="tw"><table><thead><tr>${hd.map(x=>`<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)$/);
    if(h){ flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^>\s?/.test(L)){
      flush(); const q=[];
      while(i<L0.length && /^>\s?/.test(L0[i])){ q.push(L0[i].replace(/^>\s?/,"")); i++; }
      out.push(`<blockquote><p>${inline(q.join(" "))}</p></blockquote>`); continue;
    }
    const ol=L.match(/^\s*(\d+)\.\s+(.*)$/), ul=L.match(/^\s*[-*+]\s+(.*)$/);
    if(ol||ul){
      const t=ol?"ol":"ul";
      if(lt && lt!==t) flush();
      lt=t; (list=list||[]).push(ol?ol[2]:ul[1]); i++; continue;
    }
    flush();
    const p=[]; const fld=s=>/^\s*\*\*[^*\n]+\*\*\s*[：:]/.test(s);
    while(i<L0.length && !/^\s*$/.test(L0[i]) && !/^(#{1,4}\s|>|```|\s*[-*+]\s|\s*\d+\.\s|\s*\|)/.test(L0[i])){
      if(fld(L0[i]) && p.length){ out.push(`<p>${inline(p.join(" "))}</p>`); p.length=0; }
      p.push(L0[i]); i++;
    }
    if(p.length) out.push(`<p>${inline(p.join(" "))}</p>`);
  }
  if(code && buf.length) out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

const TITLES = {ch1:"第一章", outline:"大纲", chars:"人物", style:"文风", plan:"进度"};
const ORDER  = ["ch1","outline","chars","style","plan"];
let cur = "ch1";

function render(k){
  cur = k;
  const isCh = k==="ch1";
  document.body.dataset.kind = isCh ? "chapter" : "doc";
  document.body.className = isCh ? "chapter" : "doc";
  document.title = isCh ? "第一章 注销通知" : TITLES[k] + " · 注销通知";

  const raw = DATA.docs[k].body;
  const head = isCh
    ? `<div class="chapno">第一章</div><h2 class="chapname">注销通知</h2>`
    : "";
  // 正文里的 H1 是文件名，剥掉；其余原样
  const body = isCh ? raw.replace(/^# .+\n+/,"") : raw;

  document.getElementById("sheet").innerHTML =
    `<div class="sheet fade">${head}<div class="prose">${md(body)}</div>${
      isCh ? `<div class="endmark">第一章 完</div>` : ""}</div>`;

  document.getElementById("nav").innerHTML = ORDER.filter(x=>x==="ch1"||x!=="plan")
    .concat(["plan"]).filter((v,i,s)=>s.indexOf(v)===i)
    .map(x=>`<button data-k="${x}"${x===k?' aria-current="true"':""}>${TITLES[x]}</button>`).join("");

  const done = DATA.plan.chapters.filter(c=>c.status==="completed").length;
  document.getElementById("foot").innerHTML = isCh
    ? `<button class="next" data-k="outline">大纲与设定<small>先看看这本书怎么走</small></button>
       <p class="meta">全书 ${DATA.plan.totalChapters} 章 · 已完成 ${done} 章 · 阅读约 12 分钟</p>`
    : `<button class="next" data-k="ch1">回到正文<small>第一章 注销通知</small></button>
       <p class="meta">已完成 ${done} / ${DATA.plan.totalChapters} 章</p>`;

  window.scrollTo(0,0);
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-k]");
  if(b) render(b.dataset.k);
});
render("ch1");
