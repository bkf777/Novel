<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>注销通知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#fbfaf7;
  --ink:#2b2a27;
  --ink-soft:#6f6d66;
  --ink-faint:#a3a099;
  --rule:#e2dfd8;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:18px;line-height:2.05;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#e8e2d4}

/* 顶栏：只有书名和几个文字链 */
.bar{
  max-width:680px;margin:0 auto;padding:38px 28px 0;
  display:flex;align-items:baseline;gap:16px;
}
.bar .book{font-size:15px;letter-spacing:.18em;color:var(--ink-faint);font-weight:400}
.bar nav{margin-left:auto;display:flex;gap:20px}
.bar nav button{
  border:0;background:none;padding:0;cursor:pointer;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-faint);
  letter-spacing:.06em;transition:color .15s;
}
.bar nav button:hover{color:var(--ink)}
.bar nav button[aria-current="true"]{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:1px}
:focus-visible{outline:2px solid #b9a888;outline-offset:3px}

#divider{max-width:680px;margin:16px auto 0;padding:0 28px;border:0;border-top:1px solid var(--rule)}

/* 正文 */
.sheet{max-width:680px;margin:0 auto;padding:46px 28px 0}
body[data-kind="chapter"] .sheet{padding-top:60px}
h1.booktitle{
  font-size:15px;font-weight:400;letter-spacing:.24em;color:var(--ink-faint);
  text-align:center;margin-bottom:22px;
}
.chapno{
  text-align:center;font-size:12.5px;letter-spacing:.34em;color:var(--ink-faint);
  margin-bottom:14px;
}
h2.chapname{
  font-size:30px;font-weight:600;letter-spacing:.1em;line-height:1.5;
  text-align:center;margin:0 0 44px;
}
.chapname::after{
  content:"";display:block;width:34px;height:1px;background:var(--rule);
  margin:26px auto 0;
}
.endmark{
  text-align:center;font-size:12.5px;letter-spacing:.4em;color:var(--ink-faint);
  margin:56px 0 0;
}

/* 文档型（非正文）排版 */
.doc .sheet{padding-top:44px}
.doc h1{
  font-size:14px;font-weight:400;letter-spacing:.2em;color:var(--ink-faint);
  padding-bottom:14px;margin:0 0 34px;border-bottom:1px solid var(--rule);
}
.doc h2{font-size:21px;font-weight:600;margin:44px 0 14px;letter-spacing:.02em}
.doc h3{font-size:16.5px;font-weight:600;margin:28px 0 8px}
.doc h4{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-soft);margin:24px 0 6px}
.doc p{margin:0 0 16px}
.doc ul,.doc ol{margin:0 0 18px;padding-left:20px}
.doc li{margin:5px 0}
.doc li::marker{color:var(--ink-faint)}
.doc blockquote{
  margin:0 0 18px;padding:1px 0 1px 16px;
  border-left:2px solid #ddd7ca;color:var(--ink-soft);font-size:16.5px;
}
.doc code{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.85em;background:#f1eee7;padding:1px 5px;border-radius:2px;
}
.doc pre{
  background:#f4f1ea;border:1px solid var(--rule);border-radius:3px;
  padding:15px;overflow-x:auto;margin:0 0 18px;
}
.doc pre code{background:none;padding:0;font-size:11.5px;line-height:1.7;color:var(--ink-soft)}

/* 正文小说：中文排版惯例 */
.chapter p{text-indent:2em;margin:0 0 18px}
.chapter .prose hr{
  border:0;margin:34px 0;text-align:center;height:auto;
  color:var(--ink-faint);font-size:14px;letter-spacing:1em;
}
.chapter .prose hr::after{content:"— · —"}

.tw{overflow-x:auto;margin:0 0 22px;border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}
th{
  background:#f4f1ea;text-align:left;padding:9px 12px;font-weight:600;font-size:12px;
  letter-spacing:.08em;color:var(--ink-soft);border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #eeebe4;vertical-align:top;line-height:1.7}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap;color:var(--ink-faint)}

/* 结尾导航 */
.foot{
  max-width:680px;margin:60px auto 0;padding:0 28px 70px;
}
.foot .next{
  display:block;width:100%;text-align:center;padding:22px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;cursor:pointer;
  font-family:var(--serif);font-size:15px;color:var(--ink-soft);
  transition:color .15s;
}
.foot .next:hover{color:var(--ink)}
.foot .next small{display:block;font-size:12px;color:var(--ink-faint);letter-spacing:.14em;margin-top:7px}
.foot .meta{
  margin-top:26px;text-align:center;font-size:11.5px;color:var(--ink-faint);letter-spacing:.12em;
}
.foot .meta button{
  border:0;background:none;cursor:pointer;font:inherit;color:inherit;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);
}

.fade{animation:f .28s ease both}
@keyframes f{from{opacity:0}to{opacity:1}}

@media(max-width:640px){
  body{font-size:17px;line-height:2}
  .bar,.rule,.sheet,.foot{padding-left:20px;padding-right:20px}
  h2.chapname{font-size:25px}
  .bar{gap:10px;padding-top:28px}
  .bar nav{gap:14px}
  .bar nav button{font-size:12.5px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

<script>
const DATA = {"docs":{"ch1":{"body":"# 第一章 注销通知\n\n门外有人敲了两下。\n\n沈砚抬头看了一眼屏幕。数字还在往下跳。\n\n敲门的是前台的义工。她探进半个身子。\n\n“沈老师，”她说，“陈素芬家属又来了。”\n\n“多久了。”\n\n“早上六点。现在十一点四十。”\n\n义工说完就走了。她很懂规矩——接下来的对话不该有第三个人在场。\n\n沈砚走回三号注销间，重新坐下。\n\n陈素芬还在擦那个杯子。她八十二岁，公交车售票员，退休三十年，现在在家属院给人修拉链，一天挣十二块。\n\n陈素芬三天前死了。准确地说，是肉身死了。\n\n但她的“回声”被存了下来——性格、记忆、说话的习惯，全存成一个能说能笑的东西，在一张叫“织机”的全球网里接着“活”。这玩意儿统共只能活七十二小时。\n\n今天是第三天。\n\n她记得沈砚的名字，也记得自己已经死了。这一点她一直没提，沈砚也没问。\n\n“又有事？”她说。\n\n“你女儿想续期。”\n\n陈素芬把手放下了。\n\n“续多久。”\n\n“二十四小时。”\n\n“那你倒是接啊。”\n\n沈砚没有接话。\n\n“陈姨，”他说，“按规程，你的窗口满了。”\n\n陈素芬看着他。她的手在半空停了一下，收了回去。\n\n“哦。”\n\n这一个“哦”字，她说了四十年。\n\n“我不续。”她说。\n\n“我没问你要不要续。”\n\n“我知道。”陈素芬说，“你问的是你让不让。”\n\n——\n\n沈砚在回声事务局注销处上班。他的工种叫注销员。\n\n那张全球网叫织机。就一张，覆盖所有人。\n\n人从一出生就接在上面。你打字、你看视频、你在地铁上发愣、你在半夜做梦——你这辈子的一大半都留在上面。织机拿这些留痕当材料，攒成一个特别大的东西。\n\n它拿这个东西干一件事：让死掉的人再跑一遍。\n\n人死之后，织机从这个人身上挑一部分，编成一个能说、能笑、能跟你吵架的东西，在网上接着“活”。这玩意儿有个名字，叫回声。\n\n回声只活七十二个小时。这七十二小时里，你能去看她，她记得你的名字，甚至能跟你吵一架。七十二小时一到，织机自己把它删了。她就真的没了。\n\n这件事以前是没有的。\n\n以前人死了就是死了。一张床，一个日期，几个人办手续时哭一场，然后就没有然后了。\n\n现在不一样了。现在多出来三天。\n\n多出来的这三天归注销员管。注销员陪着走完，然后在最后一格按下一个键。织机响一声，然后那个人就走了。\n\n——\n\n“按规程，”沈砚说，“谁的签字都不行，只看窗口。”\n\n“我知道。”\n\n“你女儿电话里哭了。”\n\n“我知道。”陈素芬说，“我也哭。我哭完还在这儿坐着。”\n\n“可我要是走了，”她说，“她下个月就来了。一个人。”\n\n沈砚没说话。\n\n“小姑娘不容易。”陈素芬说，“她这个月第三趟了。”\n\n“我知道。”\n\n“你知道什么？”\n\n沈砚说：“我知道她姓什么。知道她四十二岁。知道她在纺织厂三班倒，三天倒一次班，昨天是白班。知道她今天早上六点出门，没吃饭。知道她进门的时候左脚先迈的，因为右脚鞋带松了，她没蹲下系，她不会在一个陌生地方蹲下系鞋带。”\n\n陈素芬看了他一会儿。\n\n“那你让她别来了。”\n\n“我做不了这个。”\n\n“那你就不该坐在这儿。”陈素芬把杯子往旁边推了推，“你坐着，我就老想着说不说。”\n\n沈砚没动。\n\n“再跟你说一句。”他说，“续期不是免费的。你别以为我们卡你。”\n\n“卡我？”\n\n“上面批了，账就记在别处。”沈砚说，“织机跑一个回声，要烧掉一大笔算力。算力从哪儿来？从在线的人身上来。你在线一小时，它就抽走一小时。”\n\n“抽谁的？”\n\n“抽那些不会有人问的。”\n\n陈素芬看着他。\n\n“那就是不抽我。”\n\n“是不抽你。”沈砚说，“抽的是那些正在上班的、正在上课的、正在直播的。他们那一小时没了，没有人知道，也没有地方去问。”\n\n“所以你们就抽别人。”\n\n“我们只是签字。”沈砚说，“签字的人不下手，但是签字的人也不拦。”\n\n屋里安静了两秒。\n\n陈素芬把杯子又拿起来，慢慢擦。\n\n“那一小时，”她说，“对人家也就是刷会儿手机。”\n\n“对人家是。”\n\n她点点头，没再说话。\n\n过了一会儿，她抬头。\n\n“你们这行啊。”\n\n“怎么。”\n\n“不容易。”她说，“你们以为自己在做坏事，其实你们只是把坏事办完了。”\n\n沈砚站起来。\n\n“您还有两个半小时。”\n\n“我知道。”\n\n“想说什么就说。”\n\n“你不是有。”陈素芬说，“你是有两个半小时。”\n\n——\n\n四个半小时之前，他刚签过一个。\n\n签完之后他没喝水。他坐在那儿等手不抖。\n\n等到现在，手也不抖了。\n\n四年，就练成这一件事：签字的时候手不能抖，签完了更不能。\n\n抖了，就得问自己为什么签。\n\n为什么不签，又得问自己凭什么。\n\n两个问题都没答案，所以两个都不问。练到第四年，手就稳了，心也就稳了。\n\n他管这个叫手感。\n\n处里新来的人管这叫本事。\n\n——\n\n他知道这行有个说法：进门不能哭。\n\n因为一哭，就说明你把这事儿当成了一件事。\n\n当成一件事，就说明你知道对面坐着的是谁。\n\n知道了，就会开始想：我今晚回去，跟谁说。\n\n注销员一共九个人，四个注销间，一天十六单。人手卡得死死的，所以永远有人在，永远都在赶。\n\n沈砚在这儿四年，一年签一千二百多份，没出过错。\n\n他把工作做得干净、准时、没人挑得出毛病。\n\n没人挑得出毛病，是因为没人看得出别的。\n\n——\n\n“我老伴走了十二年了。”陈素芬说。\n\n这是她今天第六遍讲。\n\n“我知道。”\n\n“你不知道。”她说，“十二年，我一个人，一间房，一张床。我睡左边，他睡右边。十二年我都没换过。”\n\n她抬起头。\n\n“你知道为什么吗？”\n\n沈砚没说话。\n\n“因为睡着了要是滚过去，”她说，“醒来他得重新回来。多累啊。”\n\n注销间的空调出风口在响。很轻，一直响。\n\n倒计时一分十二秒。\n\n“别催。”她抬手挡了一下，像挡太阳，“我这辈子被人催过三回。头一回是我妈叫我吃饭，第二回是公交公司叫我发车。”\n\n“第三回呢。”\n\n陈素芬想了一会儿。\n\n“第三回……想不起来了。”她笑，“老了。”\n\n沈砚在记录板上写了一行字。\n\n他没有告诉她：回声忘事，是权重在掉。他也没告诉她，她每忘一次，档案里就多一行蓝色的字，蓝色的字是给机器看的，不是给人看的。\n\n他写的是：**认知区轻度衰减，建议家属减少刺激性对话。**\n\n这句话他写过四百多次。\n\n每次都像在替谁开一张假证明。\n\n——\n\n一分十二秒里有很长一段。\n\n陈素芬忽然说：“小伙子。”\n\n“嗯。”\n\n“你是不是也不太想走。”\n\n沈砚的手指停在半空。\n\n“陈姨。”\n\n“我就随便问问。”她说，“不答也行。”\n\n沈砚把笔放下。\n\n屋里安静了一下。空调还在响。\n\n“你说什么呢。”他说。\n\n“我说，”陈素芬把杯子又拿起来，慢慢擦，“你坐这个位置四年了。我今天看见你换了三个杯子，每个都用一样的水泡过一遍再倒掉。你怕我们喝了你的水。”\n\n她说得很慢，像在报一个站名。\n\n“你们这些人不坏。”她说，“你们就是不想待在这儿。”\n\n沈砚没有说话。\n\n“你要真不想待着，”陈素芬说，“你现在就可以走。反正我是自动的，到点我自己没。你按不按那个键，我都知道。”\n\n“陈姨——”\n\n“你别管我。”她抬手，“我就是随口一说。我老了，我话多。”\n\n她低头接着擦杯子。\n\n沈砚坐回去，把手放在膝盖上。\n\n他坐得很直。\n\n——\n\n到点了。\n\n屏幕上的数字跳到 00:00:00，然后定住，变成一行灰字。\n\n陈素芬没有变。\n\n她还是那个姿势，手里还拿着杯子。\n\n设计者在这件事上达成了一致——让回声疼，是件太残忍的事，所以回声在结束时不会变。\n\n沈砚按了那个键。\n\n织机响了一声。\n\n很短的一声。\n\n然后陈素芬手里的杯子落回桌上，水晃出来一圈。\n\n她坐在那儿，眼睛还睁着，像在等下一班车。\n\n沈砚站起来，收走桌上两个纸杯，捏在一起，扔进门边的回收桶。\n\n他做这套动作做了四年，每天做四遍。手知道怎么做，脑子可以不想事。\n\n这是他工作内容里唯一不需要负责的部分。\n\n他走到门口，回头看了一眼。\n\n陈素芬还坐着。手背上有一道很厚的茧，握笔磨的。\n\n沈砚把门带上。\n\n——\n\n走廊比注销间亮。他眯了一下眼。\n\n四楼尽头有一扇窗，窗台上常年摆着一盆死了的绿萝。处里没人承认是自己的，但也没人扔。\n\n电梯要等两趟。下来的时候，清洁工推着铁皮车进来了。\n\n“早。”清洁工说。\n\n“……几点了。”\n\n“都过午了，小沈。”清洁工笑了，“你今天又没看表。”\n\n沈砚愣了一下。\n\n他确实一整天没看表。\n\n“今天几个？”清洁工问。\n\n“三个半。”沈砚说，“我接了一个半。”\n\n“那比我忙。”清洁工按了负一，“我就四楼。”\n\n电梯往下走。两个人都没再说话。\n\n——\n\n工位在注销处东侧，十二个位置，现在坐着九个。\n\n沈砚坐下，开机。\n\n开机要十一秒。这是他每天早上最长的十一秒。\n\n屏幕亮起来。\n\n他打开任务队列。\n\n今天十六单，按时间排，规规矩矩。\n\n他往下扫。\n\n准备关掉。\n\n手停住了。\n\n——\n\n队列最底下多了一条。\n\n没有颜色，没有加急符号，没有任何标记。它就那样待在最底下，像一颗沉到河床里的石子——没人在意，但它在那儿。\n\n不是今天的单。\n\n是三年前的。\n\n沈砚把鼠标往上移了一点，让那行字进到正中。\n\n**回声编号**：E-1109-林秀云\n**姓名**：林秀云\n**状态**：已注销\n**归档日**：2042-10-12\n\n他看着这行字。\n\n一秒。两秒。三秒。\n\n他伸手把屏幕亮度调高了一格。\n\n没有变化。还是那行字。\n\n**最近一次续期**：第 1095 次\n**申请人签名**：沈砚\n\n——\n\n他的手指按在桌沿上。\n\n不抖。\n\n四年，一千二百一十七份，他的手一次都没有抖过。\n\n现在也没有。\n\n这不是抖。这是**用力**。\n\n他在用力把那只手按在桌沿上。\n\n——\n\n沈砚今天早上拒了陈素芬女儿一次。\n\n那不是大事。那是规程。规程上写着“窗口已满不得续期”，他只是照着做了一千遍里的第一遍。\n\n现在他坐在这里，手压着桌沿，看着那行字。\n\n一千零九十五次。\n\n有人用他的名字，在三年里，求了一千零九十五次让一个人留下来。\n\n一次都没批。\n\n——\n\n周执端着咖啡从旁边过来，把罐子放在他桌上。\n\n“四号的人呢。”\n\n“自动到期了。”\n\n“说什么了。”\n\n“问我喝不喝水。”\n\n周执笑了：“她每次都问这个。”\n\n沈砚没接。\n\n周执站着看了他两秒。\n\n“你手攥那么紧干嘛。”\n\n沈砚把手松开。\n\n桌沿上被压出一小块白印，一会儿就会消。\n\n“没事。”他说。\n\n周执没追问。他从来不追问。\n\n他把咖啡往沈砚手边推了推，转身走了。\n\n沈砚看着那罐咖啡。\n\n他没有拿。\n\n他这四年，桌上摆过的咖啡比喝过的水多。凉了就倒掉，倒掉之前从不看是谁请的。谁请的他也不想知道。\n\n知道的越多，就越走不出去。\n\n——\n\n他点开那行字。\n\n详情页加载了半秒。\n\n大部分字段是灰的。灰色意思是**只读**，意思是这件事已经结束了，任何人都不该再看它。\n\n沈砚往下滚。\n\n**回声编号**：E-1109-林秀云\n**生卒**：1964-04-11 — 2042-10-12\n**录入方式**：本人签署\n**首次上线**：2042-10-10 00:00:07\n**归档时间**：2042-10-12 23:59:51\n**归档方式**：织机自动注销\n**归档原因**：72小时窗口到期\n\n他停在这一行。\n\n归档方式：织机自动注销。\n\n归档原因：72小时窗口到期。\n\n这跟陈素芬今天一样。\n\n也就是说，三年前那个夜里，没有人按过键。织机自己到点，自己关掉的。\n\n那一天，他在外地。他在考场。他后来收到一条推送，点开是“回声窗口已关闭”。\n\n他当时觉得这样也好，省得他不知道说什么。\n\n然后是下面那一行。\n\n**最后一次续期申请**：已驳回\n**申请人签名**：沈砚\n\n——\n\n注销间的空调大概是从四号那边漏过来的。\n\n他没觉得冷。\n\n他记得那天的题。记得窗外有个女生在哭。记得自己把笔转了两圈才继续写。\n\n他记得自己没签过任何东西。\n\n他也记得——\n\n他记得自己那天**没有去**。\n\n——\n\n天亮了。窗外还是灰的，那盏走廊灯还亮着，四楼尽头的绿萝还死着。\n\n沈砚把记录板推到一边，站起来。\n\n他没有去泡咖啡，没有去洗手间，没有去看下一份待办。\n\n他走到门口，刷了工牌，进了电梯。\n\n电梯往下走。\n\n他按的不是负一。\n\n——\n\n---\n\n*（第一章完）*"},"world":{"body":"# 《注销通知》世界观设定\n\n> 这份文档回答四个问题：**这个世界是什么、规矩有哪几条、谁在付账、反派怎么钻空子。**\n> 正文不写设定说明书——全部用人物动作、工单数字和利益冲突演出来。\n\n---\n\n## 一句话核心\n\n**人死后，生前预录的记忆权重在网里再「活」三天；三天后想多留，烧掉的每一秒算力，都要从活人的脑波里硬抽——而最便宜、最隐蔽的抽血方式，是抽死者的亲生骨肉。**\n\n---\n\n## 时代时间线锚点\n\n- **2039 年 11 月（内测事故年）**：全球神经信号网络「织机」首次大规模并网内测。因信号冲突，架构师周正清（牧羊人）4 岁的女儿周小满脑死亡，残影被困底层；同年，绝症清洁工老郑签下首份内测自愿协议。\n- **2041 年（人事阳谋年）**：事务局改制前夕选拔首批临终关怀科审核员。陆时衍在几百份心理评估中挑出沈砚——看中的不是业务能力，而是\"极度自律、情感隔离、面对压力只会机械服从\"的心理画像。40 岁的沈砚就这样被破格提拔进了一个他自己以为是凭本事考进来的岗位。\n- **2042 年 3 月 17 日（生前预录推广）**：织机向老年及高危患病群体开放“生前神经权重预录”，林秀云确诊阿尔茨海默症当天完成签署录制。\n- **2042 年 10 月 9 日（回声纪元元年）**：织机正式向公众开放“全民免费 72 小时回声窗口”，原市立民政局临终关怀科改制为「回声事务局」。当晚林秀云去世。\n- **2042 年 10 月 12 日夜（寄生之夜）**：林秀云 72 小时到期。41 岁的沈砚在局外淋雨六小时未敢进门；牧羊人看准其懦弱，盗用其三级注销员密钥截停注销，将周小满的代码寄生于林秀云档案背面，开启连续 1095 天的静默续期。\n- **2045 年 10 月 18 日 — 10 月 26 日（主线现在时）**：回声纪元三年整（第 1095 天），沈砚 44 岁。\n\n---\n\n## 四大底层运行机制（驱动全书悬疑的齿轮）\n\n### 1. 织机（The Loom）与「算力庞氏骗局」\n\n- **表象**：覆盖全人类的神经信号网，收集活人打字、看视频、发呆、做梦的脑波留痕，免费为每位死者提供 72 小时临终回声告别。\n- **里象（陆时衍死守的政治机密）**：市政固定服务器的算力连维持正常死者的 72 小时都远远不够。从回声纪元第一天起，这就是一场**算力庞氏骗局**——织机全靠在后台静默抽取在线活人的脑波专注度与时间感知（即“回声债”）来维持运转。\n\n### 2. 回声（Echo）与干涉场物理交互规则\n\n- **本质**：不是死后提取亡魂，而是**生前签署协议那一刻的神经权重重演**。\n- **干涉场投影**：在三楼「探视间」与四楼「注销间」内，无隔离玻璃，通过高密度微粒干涉力场生成 1:1 实体化视觉投影。回声可抓握桌面上的**特制感应配给物（感应纸杯、登记表、笔）**。\n- **断电消散**：当 72 小时归零或注销员按下桌沿下的实体确认键，力场断电，**回声投影在 0.5 秒内如风吹细沙般消散，椅子变空**；其手中握着的真实感应纸杯会失去力场承托跌落桌面，水晃出一圈。\n\n### 3. 回声债的抽取顺位与「直系血亲代偿算法」\n\n维持一个回声多跑一小时 = 从活人身上抽走一小时有效脑波时间（被抽者会出现恍惚、时间跳跃感、短期记忆丢失，长期被抽会导致脑衰竭死亡）。\n\n- **宏观公共池顺位（陆时衍定的算法）**：\n  1. **第一顺位（最便宜）**：住院重症儿童（如 11 楼无窗病房的周棠，非必要活动时长可回收率是常人的 3 倍）。\n  2. **第二顺位**：中小学生与网吧包夜者。\n  3. **第三顺位**：高强度在线的底层劳工（写字楼加班族、小平台主播）。\n- **暗箱私服顺位（牧羊人利用的「直系血亲优先代偿算法」）**：\n  - 为了不惊动总局的宏观算力审计，违规续期的回声若绑定了直系亲属的神经特征，织机将优先抽取**死者的直系血亲**（因为脑波同源性最高、传输损耗最低、账面最难查出）。\n  - **林秀云一案的抽血路径**：前两年半由牧羊人（强行并入自己的脑波）与第一代偿人**沈砚**（被抽走三年短期记忆与睡眠）共同承担；半年前牧羊人脑衰竭濒死，算法自动顺着血缘网切向第二代偿人**沈苓**（每天直播 14 小时，月回收率飙至 31.2%，仅剩 4 个月可抽寿命）。\n\n### 4. 「双生寄生锁」与物理熔断规则（为什么陆时衍必须借沈砚的手？）\n\n- **双生寄生锁**：牧羊人将女儿周小满（已闭环黑户）的代码，像藤蔓一样死死缠绕在林秀云（合法延期档）的底层权重上。单独从后台强行剥离或断电，不仅会触发全城 36 个权贵黑档的连带爆炸，还会导致全楼探头网络瘫痪。\n- **唯一物理熔断方式**：必须由当初签下第一笔授权的密钥持有人（**EDO-019 沈砚**），亲自走进房间，通过生物指纹核验后按下实体注销键，才能将外壳（林秀云）与内核（周小满）一并合法闭环销毁。\n\n---\n\n## 五、为什么偏偏是沈砚（人事阳谋 × 物理死锁）\n\n> 这本书回答的最后一个问题，也是最关键的一个：**为什么全城几千个注销员里，被寄生的是他？**\n> 答案不是巧合。织机的底层架构与事务局的人事设计，在 2041—2042 年间完成了一次**隔着三年的精准合谋**。\n\n### 1. 人事阳谋：陆时衍挑人的标准\n\n- **时间**：2041 年，织机改制前夕，事务局从全市民政系统选拔首批\"临终关怀科审核员\"。\n- **筛选标准（反常识）**：陆时衍要的**不是**业务最强的人，而是——**性格软弱、习惯自我合理化、遇到创伤只会逃避然后闷头干活的人。**\n- **为什么**：如果换一个刚正不阿、眼里揉不得沙子的年轻热血新人坐上这个位子，他只要在工位上多看一眼底层日志，36 个权贵黑档和牧羊人的私服早穿帮了。**只有沈砚这种\"拿职业温柔当防护罩、对私事绝对闭眼不看\"的人，才能安安稳稳替全局驮满三年。**\n- **沈砚本人对此毫无察觉**：他一直以为自己是凭本事考进来的。他不知道自己的入职档案被局长翻过多少遍。\n\n### 2. 物理死锁：三条不可复制的交集条件\n\n小满（2039 年死）要缠上林秀云（2042 年死），必须同时满足三条互相排斥的条件，而它们在 2042 年 10 月同时成立：\n\n| # | 条件 | 为什么它几乎不可能凑齐 |\n|---|---|---|\n| ① | **经办人本人** | 按规程，`EDO` 前端签批密钥必须由死者直系亲属本人保管，经办人才持有唯一物理熔断权限 |\n| ② | **直系亲属卡在公测元年第一批** | 林秀云是织机公测首批预录者，她的档案拥有全网唯一一个\"72 小时可合法转永久挂起\"的外壳状态 |\n| ③ | **还有一个最适合当抽血泵的直系血亲** | 沈苓高强度在线 14 小时，能量波动最易抽取，可无缝承接后台算力代偿 |\n\n**三选一在任何一个案子里都能凑齐，三条同时成立约等于零。** 陆时衍负责制造条件①③，牧羊人负责等待条件②——两人各据一头，从未通过气，却把同一份档案锁死了三年。\n\n### 3. 合谋的产物：一个\"完美背锅容器\"\n\n> 沈砚不是随机被选中的钥匙，他是**被制度主动制造出来的**——被挑中的性格、卡准的时间线、刚好合适的妹妹，缺一不可。\n>\n> 这也是全书最狠的一层：**他以为自己是受害者，其实在被选中之前，他就已经是共犯。** 一个从不问\"为什么\"的人，才是最完美的背锅容器。\n\n---\n\n## 六条铁律与禁用词约束\n\n1. **六条规矩第一章当场演完**：①回声只活 72 小时 ②到期自动归零 ③注销员按键彻底闭环 ④续期需注销员签字（按规程期满拒签） ⑤续期算力抽自在线活人 ⑥签字的人不下手偷，但也不拦着。\n2. 🚫 **全篇绝对禁用「系统」二字**：无论是正文、大纲还是角色台词，一律使用**「织机」「终端」「内网」「后台」或「主脑」**，彻底杜绝网文系统流错觉。"},"outline":{"body":"# 《注销通知》 全书大纲\n\n## 基本信息\n\n- **题材**：硬核软科幻 / 伦理悬疑 / 家庭救赎\n- **章节数**：24 章（每章 3000-5000 字，总计约 9-10 万字）\n- **核心立意**：体面的告别需要勇气，而不肯放手的执念，永远由无辜的活人买单。\n- **核心冲突（三方死局）**：\n  - **牧羊人（寄生者）**：为了给脑死亡的 4 岁女儿小满续命，看准沈砚三年前雨夜不敢进门的懦弱，盗用沈砚密钥将沈砚母亲林秀云锁在探视间续命 1095 天当“防弹衣”，并在自己脑衰竭后触发血亲代偿算法，把沈砚妹妹沈苓当成了抽血袋（仅剩 4 个月命）。\n  - **陆时衍（做局者）**：为了掩盖织机全民算力庞氏骗局和 36 个权贵私服黑档，不敢强攻牧羊人，于是故意把林秀云的异常档案抛给沈砚，逼沈砚为了救妹妹亲手去拔母亲和牧羊人的网线。\n  - **沈砚（破局者）**：从“以为自己害死母亲的罪人”，发现自己只是“被反派当成防弹衣和擦枪布的懦夫”，最终在 9 天倒计时内掀翻回声债黑账，并走进 3-C 探视间体面地接母亲下班。\n- **叙事视角**：第三人称限制视角，全程严贴沈砚（仅第 21 章切换一次牧羊人视角）。\n- **时间线锚点**：主线跨度 9 天（2045 年 10 月 18 日 — 10 月 26 日）。\n\n---\n\n## 24 章全局规划表\n\n| 章节 | 标题 | 核心事件与反派博弈推进 | 承接上章 | 章首引子 | 章末悬念钩子（具体物/动作） | 出场人物 | 场景列表 |\n|-----|------|-----------------------|---------|---------|-------------------------|---------|---------|\n| 第1章 | 注销通知 | 沈砚按规程拒签陈素芬女儿的续期申请（六条规矩当场演完），到点按键使陈素芬投影消散、纸杯落地；傍晚在工位结案队列最底端发现母亲林秀云的词条：表面标着三年前已注销，底层却跳出红色日志——第 1095 次续期扣缴中，6 小时前刚签批，签批人是他自己。 | — 沈砚向局里递交了辞呈，走进探视间 3-C，陪母亲走完三年前他逃掉的那最后 72 小时。三天里，他坐在桌对面，把她这三年来在探视间里写的厚厚一摞登记表，一页一页念给她听。 | 承接章22清算期 | 救赎高潮 | 倒计时最后一分钟，沈砚嗓子已经全哑了。林秀云停下手里的笔，抬头摸了摸他的手背，第一次没有问登记，而是问：“砚砚，外头雨停了吗？你今天吃饭了吗？” 沈砚喉结剧烈滚动，四年里第一次说出那三个字：“对不起，妈。雨停了，我来接你下班。” 倒计时归零，沈砚亲手按下确认键，枣红色的身影化作细沙消散，温水杯“啪”地落回桌面。 | 沈砚、林秀云 | 探视间 3-C |\n| 第24章 | 下班 | 大结局。被抽走的在线时长与短期记忆如春水般缓慢返还给全城活人。沈苓的记忆断片消失，直播间恢复正常，她给哥哥发来热气腾腾的早餐照片。沈砚办完离职交接，走出正在被改组整顿的回声事务局大楼。周执在台阶下等他，递过来一罐热咖啡；老郑正在门口扫落叶。 | 承接章23 | 余韵收束 | 一阵秋风吹过，老郑口袋里那张黄色便签纸飘落在沈砚脚边。沈砚弯腰捡起来，看清了被老郑描了无数遍底下露出的那行钢笔字——**「记得你欠我一顿饭」**。那是三年前那个雨夜凌晨，他帮老郑付完阳春面钱后留下的便签。沈砚把纸条塞回老郑口袋里，拍了拍他的手背：“走吧，老郑，今天我请。”天亮了。 | 沈砚、周执、老郑、沈苓（信息） | 回声事务局大门口 / 晨光中的街道 |\n\n---\n\n## 全书悬念与反转节奏（四次翻底牌）\n\n1. **第一层（第 1–5 章｜谁在签字？）**：母亲三年前就已自动注销的死档，为什么在底层偷偷续期了 1095 次，且正在以 31.2% 的恐怖比例抽干妹妹沈苓的脑波时间？→ *揭秘一：局长陆时衍故意抛出这条档案当诱饵，想借沈砚的手去拔底层毒瘤。*\n2. **第二层（第 6–12 章｜为什么要绑我妈？）**：顺着缺角私印查到前架构师牧羊人（周正清），发现 4 岁小满的代码以「双生寄生锁」缠在林秀云背上——牧羊人当年在监控里看准了沈砚雨夜不敢进门的懦弱，拿林秀云当防弹衣、拿沈砚和沈苓当血袋，而沈苓只剩最后 4 个月寿命！\n3. **第三层（第 13–17 章｜死人与活人怎么选？）**：走进 3-C 探视间发现母亲生前确诊当天就录好了权重，且一直在用自身残存权重拼命护着儿女不被抽干；此时陆时衍抛出交易——只要沈砚帮他掩盖另外 36 个权贵黑档、单独杀掉牧羊人和林秀云，就立刻救沈苓和周棠。\n4. **第四层（第 18–24 章｜承认懦弱，掀翻牌桌）**：沈砚按键时触发「不在场」逻辑锁，找回被抽走的核心记忆——三年前那晚他其实到了楼下，却当了六个小时逃兵；他亲手删掉维持体面的假病假条，与油尽灯枯的牧羊人联手掀翻了整个 37 人特权私服池，让陆时衍的庞氏骗局彻底崩塌，最后干干净净地走进 3-C 房间，接母亲下班。"},"chars":{"body":"# 人物档案 · 《注销通知》\n\n> 本档案为写作直接依据。每个角色的性格核心、利益闭环、致命缺陷、说话风格必须具体到可直接指导对话与场景的程度。\n> 铁律一：**每个人的每一句台词，都应该让读者听得出\"这是他说的\"。反派不靠发疯作恶，靠严丝合缝的生存逻辑作恶。**\n> 铁律二：**反派的每一步算计，都必须建立在对主角人性弱点的精确利用上。沈砚不是偶然成了那把钥匙——他被陆时衍与牧羊人前后两次筛选出来，是被制度主动制造的\"完美背锅容器\"。**\n>\n> ⚠️ 写每一场对手戏前先自检：**这一场里，反派利用的是沈砚的哪一个具体弱点？** 答不上来，这场戏就是空转。\n\n---\n\n## 主角\n\n### 沈砚\n\n- **年龄/职业**：44 岁（2001 年生），回声事务局注销处三级注销员（EDO / Echo Deletion Officer）。工龄四年（2041 年入职前身“市立民政局临终关怀科”，2042 年随织机上线改制为注销处），签发注销通知 1,217 份，从未出过差错。\n- **外貌特征**：瘦。制服是均码，穿在身上肩线塌下去一截，显得整个人被衣服挂着。左手虎口有一层薄茧（长期戴权限手套磨的）。左眉尾一道极淡的旧疤。眼睛下方常年一层洗不掉的青灰。指甲剪到贴着肉——职业习惯，因为签字和按键时不能让指甲刮到纸或面板。手非常稳，比他自己以为的稳得多。\n- **性格核心**：**职业性的温柔，与深层的心理逃避**。他能对一个素不相识的、已经死了两天的老人，做到全程不冷脸、不催促、递水时用双手。所有人都说沈砚这人真好。但所有这些温柔都停在工作半径之外——出了那个门，他是一台关掉了回应的机器。\n- **核心价值观**：让告别有个体面的结束。他真心认为：每个人都应该能决定自己什么时候、以什么方式被忘记。这是他选择这份工作的原因，也是他唯一说得出口的理由。\n- **最大恐惧**：被人善待。比任何东西都怕。别人对他温和，他就得回答\"我最近怎么样\"，而这个问题的正确答案是\"我在逃\"，他答不出口。\n- **致命缺陷**：**过度合理化与自我惩罚**。他能给任何事找到无懈可击的理由，包括逃避。三年前那晚他没敢进门送母亲最后一程，他给自己的解释是\"那天我在外地晋升统考，赶回来太晚了\"——一个三年前他就没信过、却用了三年没换的说法。他不撒谎，他只是**存心让自己的谎言听起来合理**。\n  - **这个缺陷是他被陆时衍亲手挑中的原因**：一个面对至亲离世都选择在雨里当逃兵、习惯把内疚压进公文里的人，绝不会在工位上多看一眼底层日志。**那套\"考试来不及\"的谎言之所以能安稳用三年，不是因为他演得多好，是因为他从来就没有想拆穿它。**\n- **内心渴望**：他渴望有人告诉他\"那不是你的错\"。但更深的地方，他其实更渴望有人告诉他\"那是你的错\"——因为那至少是一个他能承担、能赎的答案。\n- **背景故事与核心真相**：\n  - 12 岁（2013 年），母亲改嫁，改名林秀云。14 岁生父去世，母亲没哭，只是把他的衣服一件件登记在墙上。母亲做过三十一年社区档案员，常说：\"纸会烂，但它不会骗人。\"\n  - **2041 年（入职）：他是被挑进来的，不是投上来的。** 改制前夕，陆时衍审完全市民政系统几百份心理评估，最后破格把沈砚提进临终关怀科当首批审核员。**他看中的从来不是业务能力，是那张心理画像——极度自律、情感隔离、面对压力只会机械服从、绝不生事。** 一个绝不敢主动多问一句的人，才是替全局驮这本烂账最稳的那匹马。\n  - 2042 年 3 月 17 日，78 岁的林秀云确诊早期阿尔茨海默症，成为全网第一批签署“生前神经权重预录协议”的自愿者。她对记者说：\"我怕到时候忘了你们长什么样，也怕忘了我自己是谁。\"\n  - 2042 年 10 月 9 日（回声纪元元年），林秀云突发心梗去世，次日零点回声上线。\n  - 10 月 12 日夜（72 小时窗口到期夜），41 岁的沈砚从外地晋升考场赶回本市。他在大楼外的冷雨里站了整整六个小时，因为恐惧面对母亲的消散，一步都没敢迈进大门。\n  - 第二天早上，他收到一条终端回执：**《续期申请已驳回（申请人：沈砚）》**。他以为是内网默认走了家属拒签流程，怀着灭顶的愧疚躲了三年，一次都不敢去查母亲的底档。\n  - **为什么全城只有他能当这把钥匙——三条不可复制的物理死锁条件**：\n    1. **他是经办注销员**：只有经办人能持有合法的 `EDO-019` 前端签批密钥，而按规程，这枚密钥必须由死者的直系亲属本人保管。\n    2. **他的直系亲属卡在公测元年第一批**：林秀云是织机公测首批预录者，她的档案拥有全网唯一一个\"72 小时可合法转永久挂起\"的外壳状态。\n    3. **他还有一个最适合当抽血泵的妹妹**：沈苓高强度在线 14 小时、能量波动最易抽取，能无缝承接双生寄生锁启动后的后台算力代偿。\n    > 三条同时成立的概率，约等于零。**这不是巧合，是陆时衍与牧羊人隔着三年的一次合谋。**\n  - **他不知道的真相**：那晚他站在雨里发抖的样子，被正在底层找\"替死鬼防弹衣\"的架构师牧羊人看见了。牧羊人看准他是个绝不敢查档的懦夫，盗用他的三级注销员密钥截停了注销，将林秀云锁进 3-C 探视间续命 1095 天，并把沈砚本人接进了算力代偿池——沈砚这三年越来越严重的失眠、记忆断片（包括忘掉自己那晚其实到过楼下），全是因为他的脑波正在被织机当成活体服务器抽走。\n- **说话风格**：短句，单句不超过 20 字，几乎不用形容词。紧张时话更少、更完整，像在写公文。极少说\"我\"，全书在第 23 章前从不说\"对不起\"。表达在意的方式是**动手**：替人倒水、摆正号码牌。\n- **口头禅**：「知道了。」「还剩多久。」\n\n---\n\n## 反派（双反派利益闭环）\n\n### 牧羊人（代号 Shep / 本名：周正清）——「拿你妈当防弹衣的寄生者」\n\n- **年龄/职业**：45 岁（2000 年生）。织机早期核心架构师之一，现公开身份已注销，藏身于织机底层值班室，掌握底层代码改写权限，但**没有前端注销员的合法签批密钥（EDO Token）**。\n- **性格核心**：**对着仪表盘谈感情的赌徒**。他从不谈道德，只谈损耗比和存活率。工单上唯一有温度的数字是 **39.1℃**——他女儿小满脑死亡前最后一次体温记录。\n- **核心犯罪动机（为什么非要绑架沈砚、替林秀云续期 1095 次？）**：\n  1. **黑户寄生需求**：2039 年 11 月织机首次并网内测事故中，他 4 岁的女儿周小满因信号冲突脑死亡，在官方库里早已标记为`【已闭环】`。一旦他直接调取全网算力喂给一个闭环死档，0.1 秒内就会触发织机主脑的熔断警报。\n  2. **寻找完美肉盾**：他必须找一个\"刚死不久、拥有合法窗口、且经办注销员恰好是直系亲属（权限最高）\"的活档案做外壳，将小满的残影代码以**「双生寄生锁」**的方式缠绕在该档案背面。外壳活，小满活；外壳销户，小满当场碎裂。\n  3. **踩中双重回声的时间交集**：小满 2039 年死在底层冷却舱，残影撑到 2042 年 10 月已濒临消散；而就在这个月，林秀云作为公测首批预录者去世，沈砚恰好是该片区的经办注销员。**三条本该互相排斥的条件，在同一个月里同时成立**——这是牧羊人等了三年才敢动手的唯一窗口。\n  4. **锁定懦夫沈砚**：2042 年 10 月 12 日雨夜，他透过监控看见 41 岁的沈砚在楼下站了六个小时不敢进门送母亲最后一程。他立刻意识到：**一个连亲妈最后一面都不敢见的懦夫，未来三年绝不敢点开母亲的底档查账，是全世界最安全的防弹衣！**\n  5. **前两年半的自残与半年前的失控**：牧羊人并非纯粹的恶魔。前两年半（900 多天），他将林秀云和小满的双份算力消耗全部绑定在**他自己和沈砚**两个男人的脑波上硬扛；直到半年前，牧羊人因长期透支出现严重脑衰竭，织机底层的**「直系血亲优先代偿算法」**自动触发，顺着血缘网将抽血泵切向了高强度在线的沈砚妹妹——沈苓。\n- **致命缺陷**：他用“父爱”合理化了一场针对无辜家庭的寄生绑架。他既冷酷地利用了沈砚的懦弱，又在底层替沈砚撑住了母亲三年，最后死于自己亲手写下的寄生规则。\n- **说话风格**：极简，满口数字、损耗率与成本。\n- **口头禅**：「成本我出。」（前两年半他确实自己出了命，最后半年却要了沈苓半条命）\n\n### 陆时衍 ——「拿沈砚当擦枪布的做局者」\n\n- **年龄/职业**：56 岁（1989 年生），回声事务局局长。\n- **外貌**：偏瘦，戴细框眼镜，说话时习惯低头看对方胸口的工牌编号而非眼睛。\n- **性格核心**：**制度性的冷酷诚实**。他把所有烂账摊在桌上，用统计数字碾碎个人道德。\n- **核心政治动机（为什么明知有 4.7 亿小时回声债黑洞，却不抓牧羊人、反而逼沈砚动手？）**：\n  1. **掩盖“算力庞氏骗局”**：2042 年政府强推“全民免费 72 小时回声窗口”政绩工程时，陆时衍就清楚市政服务器根本不够用——哪怕没有违规续期，维持正常死者的 72 小时，也必须靠偷偷抽取活人脑波（优先抽最便宜的住院儿童和底层熬夜者）来填窟窿。一旦真相曝光，织机崩盘，他立刻沦为阶下囚。\n  2. **投鼠忌器的特权黑名单**：牧羊人为了掩护小满，在底层一共开了 **37 个违规续期后门**——除了林秀云，剩下 36 个全是本市高官与富豪私下续命的亲属。牧羊人手里捏着这份名单，陆时衍一旦强行断网抓捕牧羊人，36 个权贵黑档同时曝光陪葬，陆时衍政治生命当场终结。\n  3. **借刀杀人（第一章异常词条的幕后推手）**：陆时衍查出牧羊人的主寄生节点挂在`E-2042-1109-林秀云`名下，而底层逻辑锁规定：只有绑定密钥的沈砚本人在场按下实体确认键，才能在不惊动其他 36 个权贵节点的前提下，精准物理熔断牧羊人和小满！\n  4. **做局**：因此，**第一章末尾林秀云那条沉底三年的档案突然浮出水面，根本不是故障，而是陆时衍故意解开屏蔽扔给沈砚的诱饵！** 他故意把沈苓被抽干的账单递到沈砚眼前，就是要逼沈砚为了救妹妹，亲手去拔掉母亲和牧羊人的网线，替事务局干干净净地擦掉这块脏污。\n  5. **人事阳谋（一切的前提）**：早在 2041 年改制前夕，正是陆时衍亲手审阅并批准了沈砚的入职档案——他挑中的从来不是最能干的人，而是**最软弱、最不会主动惹事、习惯把痛苦咽进肚子里的人**。因为账本只有最不敢查的人才会替全局驮满三年。\n  6. **引而不发**：陆时衍其实早就通过宏观审计发现了牧羊人挂在沈砚名下的私服黑账（连同另外 36 个权贵黑档），**但他一直引而不发**。因为他算得很清楚：**只有像沈砚这样内疚、逃避、又已经被妹妹的命逼到墙角的人，在得知真相后才会用最沉默、最决绝的方式，把这颗定时炸弹亲手拆掉**——而且拆的时候，还会以为那是自己在伸张正义。\n  > **陆时衍最高明的地方：他从来没有威胁过沈砚，他只是一直在挑人。**\n- **说话风格**：像在念一份精确到小数点后两位的审计工单。念完最残忍的数字后，习惯沉默两秒。\n- **口头禅**：「数字不会撒谎。人会。」\n\n---\n\n## 配角\n\n### 周执\n\n- **年龄/职业**：51 岁（1994 年生），沈砚同事，三级注销员，总工龄九年（前六年民政局，后三年注销处），全处出勤第二。\n- **外貌与习惯**：永远拎着罐装咖啡，抽屉里攒着 72 个空罐，桌上有一圈洗不掉的杯印。私下替回声家属手写了 1,300 多封回信。\n- **核心动机与秘密**：\n  - 女儿周棠（7 岁，先心病）住在市立儿童医院 11 楼无窗病房——那里的住院儿童时间被陆时衍定为“第一优先廉价回收池”。\n  - 为了把女儿从回收池里赎出来并凑够手术排期所需的“时长余额”，周执替陆时衍干过脏活（负责给那 36 个权贵黑档做账面平账），算了两年，还差 400 小时。\n  - 他早就知道牧羊人寄生在沈砚母亲档下，但他不敢说——说了，他女儿的 400 小时就彻底泡汤。\n  - 他亲手注销过自己父亲的回声，纸质单写了 27 行，终端只存下两个字：\"同意\"。\n- **口头禅**：「这单我不接。」「先活着再说。」\n\n### 沈苓\n\n- **年龄/职业**：36 岁（2009 年生），沈砚同母异父的妹妹（随母原姓沈）。小平台游戏主播，粉丝 11 万。\n- **外貌与性格**：浓妆掩盖红血丝，眼底和哥哥一样有遗传的青灰。**硬撑型乐观**，直播间永远挂着\"第 N 天挑战\"，掉粉了就笑着骂算法瞎了。\n- **核心处境（生死倒计时）**：\n  - 半年前牧羊人脑衰竭后，织机的「直系血亲代偿算法」自动将林秀云与小满的巨额算力黑洞切到了沈苓头上（因为她每天高强度在线 14 小时，最易抽取）。\n  - 她本月在线时长回收率高达 **31.2%（全平台第一）**。她开始出现严重的短期失忆、在镜头前断片昏睡，却以为是自己不够努力，把直播从 6 小时加到 14 小时——越播抽得越狠，距离脑波彻底枯竭只剩 **4 个月**（全书最紧迫的救人倒计时）。\n- **口头禅**：「我没事。」「哥你吃点东西啊。」「我今天播了十四个小时。」\n\n### 林秀云（母亲）\n\n- **生卒**：1964—2042（享年 78 岁）。社区档案员三十一年，手背有常年握笔的硬茧，穿枣红色旧外套。\n- **回声状态**：被牧羊人当作小满的寄生外壳，锁在三楼 3-C 探视间整整 1095 天。她不知道自己成了算力黑洞的肉盾，也从不说自己死了，只是温和而固执地每天坐在桌后做登记，等大儿子沈砚来接她下班。\n\n### 周棠（周执女儿） & 周小满（牧羊人女儿）\n\n- **周棠**：7 岁，先心病，躺在 11 楼无窗病房的廉价算力池里，全书出场 3 次，不说话。\n- **周小满**：4 岁，2039 年内测脑死亡。全书前 20 章只以寄生代码、语音录音、39.1℃ 体温读数存在，第 21 章唯一一次在值班室现身道别。\n\n### 老郑\n\n- **年龄/职业**：66 岁（1979 年生），大楼夜班清洁工（扫了 29 年地）。\n- **真实身份**：2039 年第一个签署内测协议的“自愿活体回声”（绝症晚期押上全部神经权重，靠扫地和充当底层测试节点换取续期）。\n- **关键道具**：每次续期重置会丢失近期记忆，口袋里永远揣着一张描了无数遍的黄便签纸：**「记得你欠我一顿饭」**——那是 2042 年 10 月 12 日雨夜凌晨，在楼下罚站六小时的沈砚在早点摊帮他付过一碗面钱后留下的便签。老郑是教沈砚用物理盲区破局的关键引路人。\n\n### 老韩\n\n- **年龄/职业**：约 70 岁，局里资历最老的档案员兼一楼保安监控中心的值守人，管 B2 原始底档调阅权限十九年。\n- **说话风格**：只说档案编号和日期，不评价。像一台会喘气的检索机。给他一句情绪化的台词他就答非所问。\n- **功能**：全书两个关键铁证都由他调出——第 2 章调出 1095 张扣费回执，第 19 章调出 2042 年 10 月 12 日夜 20:47—02:58 的门禁外围监控（6 小时 11 分）。\n- **口头禅**：「编号。」\n\n### 陈素芬（第 1 章开篇人物）\n\n- **年龄/生卒**：八十二岁，公交车售票员，退休三十年；现居家属院，替人修拉链，一天挣十二块。\n- **死法与状态**：三天前肉身死亡，生前已签预录协议，回声在织机里活到第 72 小时。她的纸杯是真的——感应配给物，被她一直偷偷藏起来，因为她不想被注销得太快。\n- **核心台词（第 1 章立规的那场戏）**：家属求续期时她主动拒绝——「我不续。」这句拒绝让沈砚当场拒签有了正当性，也让读者第一次看清“续期要有人签字担保”意味着什么。\n- **功能**：全书规矩的演示器。她一个人演完六条铁律，是沈砚**亲手拒签过的第一个人**——这条前因是第 20 章他改口说“今天我拦”的支点。\n- **口头禅**：「那我倒是接啊。」\n\n### 义工（第 1 章开场）\n\n- 前台义工，探半个身子进门通报「陈素芬家属又来了」，说完就走。全书只出场这一次，不留姓名。\n- 功能：**她的分寸感本身就是规矩**——接下来的对话不该有第三个人在场。她的作用是把读者推进门，同时让沈砚的岗位性质一秒立住。\n\n---\n\n## 核心利益与剥削链条图"},"style":{"body":"# 《注销通知》文风基准\n\n> 本文件是全书的文风宪法。每一章动笔前先扫一眼，写完后再回来对照检查。\n> **判定标准**：如果某一章读起来像\"另一个作者写的\"，就是文风跑偏了。\n\n---\n\n## 一、文风指纹\n\n| 维度 | 目标 |\n|------|------|\n| **对话占比** | 38%–44%（对话是本书的主干，叙述是骨架） |\n| **句子节奏** | 短句为主。单句均值 ≤ 18 字。动作段单句 ≤ 10 字。禁止出现超过 35 字的叙述长句 |\n| **段落呼吸** | 每段 1–4 行。连续叙述不超过 3 段，第 4 段必须是对话或独立成段的动作 |\n| **叙述距离** | 贴脸第三人称限制（严贴沈砚）。**沈砚看不见的东西，读者也不许先知道**——包括全知旁白、上帝视角、\"后来才知道\"式的前置剧透 |\n| **描写倾向** | 克制。全书形容词密度控制在每百字 ≤ 4 个。情绪不靠形容词，靠**动作和物件** |\n| **情绪最高点** | 始终压在水面下。不允许一章里出现两次以上\"心口一疼\"\"鼻子一酸\"。人物越痛苦，句子越短 |\n\n### 五个硬指标（每章自检）\n\n1. **开篇 200 字内必须有动作或对话**，禁止天气、禁止背景铺垫、禁止回顾\n2. **新名词首现必须给可感知线索**，不许用定义句（详见设定词典）\n3. **每章结尾必须是钩子**，且钩子必须是**具体物或具体动作**，不能是抽象感慨\n4. **每章至少 1 处\"展示而非讲述\"** —— 把情绪换成一个动作、一件物品、一句没说出口的话\n5. **沈砚的台词**：短、完整、无形容词。**全书禁止沈砚说超过 20 字的台词**\n\n---\n\n## 二、基准段落\n\n### 范例 A · 沈砚视角（专业温柔 + 深层麻木）\n\n> 注销间的灯是两盏，可调的。现在调到最暗那一档。\n>\n> 桌上两杯水。沈砚那杯没动过。他坐得笔直，手放在膝盖上——标准姿态，四年练出来的，看起来像在听课。老师傅说这是敬业，他说这是习惯。习惯和不紧张是两件事。\n>\n> 对面的老人把杯子握在手心里，指头很粗，指甲剪得很短。她讲她老伴，讲了大概六遍。前五遍他都在听。第六遍他也在听。\n>\n> \"他走了十二年了，\"她说，\"今年该轮到我领低保了。\"\n>\n> \"嗯。\"沈砚说。\n>\n> 老人笑起来。回声的笑和活人不一样——活人的笑是往上走的，回声的笑是**回来的**，像一段被录好的东西又播放了一遍，起点比终点高一点点。\n>\n> 他看了一眼手腕。屏幕上还有一小时四十分钟。\n>\n> \"您还有想说的吗？\"他问。这句话他每天说四遍。四个小时下来，四个注销间，他一共问了三十二遍。每一遍他都听得很认真。\n>\n> 他不是装的。装不了这么久。\n>\n> 老人想了想，说：\"小同志，你说人死了以后……会不会有人记得我？\"\n>\n> 沈砚没有立刻回答。他在心里过了一遍标准话术——\"您的音容笑貌会被妥善保存\"——这句话他一年要说八百遍，说到自己都信了。\n>\n> 他今天说的是另一句。\n>\n> \"会。\"他说，\"至少今天有人记得。\"\n>\n> 老人点点头，低头看杯子。杯子里的水凉了她也没发现。\n>\n> 沈砚把记录板上的时间改了一下。他多给她留了二十分钟。\n>\n> 这不算违规。二十分钟的偏差，系统会记在核验员头上。而核验员这一栏，永远是他自己的名字。\n\n**这段在示范什么**：\n- 全部情绪靠动作承担——\"杯子里的水凉了她也没发现\"\"他多给她留了二十分钟\"\n- 沈砚破了一次例，例外本身比台词更重要\n- \"回声的笑是回来的，起点比终点高一点点\" —— 一句话建立一个世界观\n- 短句、贴脸、无形容词、贴脸第三人称\n\n---\n\n### 范例 B · 陆时衍视角（制度性的诚实）\n\n> \"第四季度，回收时长 4.7 亿小时。\"陆时衍念完，把眼镜往上推了推，\"折合人均每周 22.6 分钟。这是我要说的全部。\"\n>\n> 没人说话。\n>\n> \"我知道你们想听什么。\"他说，\"你们想听我说我们在控制，在优化，在找办法。我都可以说，但说了对你们没用，对那 4.7 亿小时更没用。\"\n>\n> 他把手里的纸翻了一面。纸很薄，翻过去的时候有声音。\n>\n> \"分配规则贴在公告栏里，公示期一百八十天，任何人可以提异议。我不隐藏任何数字。\"他停了停，\"我不是在说服你们。我是在告诉你们数字。\"\n>\n> 沈砚看着那张纸的背面。背面是空的。\n>\n> \"陆局，\"他说，\"住院儿童那部分，为什么排在第一优先回收？\"\n>\n> \"因为他们最便宜。\"陆时衍说得很平，\"住院儿童的非必要活动时长，可回收比例是常人的三倍。他们不是在直播，不是在上班，不是在打游戏。他们在等。\"\n>\n> 他把纸放下。\n>\n> \"你觉得这很脏。我知道。\"他说，\"但你告诉我，一个不用脏的办法 costing 什么？我算过。第九版方案的核心假设是回声总量在两年内下降到 0.3%。实际是 4.7%。我念给你听的是第几版你知道吗？\"\n>\n> 沈砚知道。第九版。\n>\n> \"十四版。\"陆时衍说，\"数字不会撒谎。人会。但数字也不够用。所以我才站在这儿。\"\n>\n> 他停了两秒。\n>\n> 这两秒不在他的稿子里。\n\n**这段在示范什么**：\n- 反派不是靠\"坏\"写出来的，是靠\"他说的每一句都对，但结论他接受\"写出来的\n- \"等待的两秒不在稿子里\" —— 全书的情感只能这样放进去\n- 数字就是这本书的修辞，不需要翻译成形容词\n\n---\n\n## 三、负面清单（AI 写作痕迹清除）\n\n以下写法**每章禁止**：\n\n| 禁止 | 正确做法 |\n|------|---------|\n| 沈砚\"心中五味杂陈\" | 写他把手放在门框上，指节发白 |\n| 描述角色的心理活动超过两行 | 一句心理 + 一个外部动作，立刻结束 |\n| \"他知道，这只是开始\" | 直接写下一件事发生 |\n| 每段开头用人物名 | 用动作、声音或物件起头 |\n| \"不禁\"\"仿佛\"\"似乎\"连用 | 删掉，让句子直说 |\n| 环境描写超过 3 行且不带信息 | 删到 1 行以内，或让它携带信息（如\"灯调到最暗那一档\"） |\n| 沈砚用抽象词表达情绪（痛苦、愧疚、释然） | 换成具体行为 |\n| 对话前后加\"他淡淡地说\"\"他冷冷地说\" | 删掉，靠台词本身区分人 |\n| 章末用感慨收尾 | 章末必须是物、动作或信息 |\n| 解释读者已经能推断的东西 | 删 |\n| 排比句用于抒情 | 排比只用于**机构发言**（陆时衍、制度文本） |\n\n---\n\n## 四、沈砚台词红线\n\n- 单句 ≤ 20 字\n- 不使用\"我\"开头超过 2 次的段落\n- 紧张时省略主语和助词\n- 从不说\"对不起\"，全书一次都没有——这是他最核心的说话特征，第 23 章第一次说出口\n- 表达关心 = 动手（倒水、解鞋带、把东西摆正）\n\n---\n\n## 五、本书校准段落\n\n> （初始为空。第 1 章完成后由 Phase 3 回填实际写法，作为后续章节的比对基准。）\n\n---\n---\n\n## 六、第一章专属规则（血泪教训，最高优先级）\n\n> **这一节的规则高于上面所有规则。**\n\n### ❌ 犯过的错（不要重犯）\n\n初版第一章 3672 字，读者反馈**「看不懂」**。诊断结果：\n\n1. **把设定写成段落**——「回声纪元三年。织机上线三年了。」然后整段解释。读者读了 20 轮对话才知道这是科幻。\n2. **冷到没有温度**——为了执行「形容词≤4/百字」「情感压在水面下」，把老太太讲老伴那段最暖的戏，用「这声音他听了四年」摁死了。\n3. **自欺欺人的机器病**——写了「公共交通 retired. 不对。是\"退休\"」，试图模拟真人打错字，实际效果是**读者觉得作者有毛病**。\n4. **钩子需要前情才懂**——钩子是「一个已注销的回声出现在队列里」，而读者当时连「回声」是什么都刚知道。\n\n### ✅ 第一章的铁律\n\n| 规则 | 说明 |\n|------|------|\n| **规矩用演，不用讲** | 六条规矩必须在**同一场戏里走完一整轮完整流程**（有人求续期 → 拒签 → 陪完 → 按键 → 人消失）。禁止出现任何独立于场景的设定讲解段落。 |\n| **规矩未立，禁上情绪** | 读者还没搞懂这个世界之前，任何情感冲击都会被当成信息噪声吞掉。先交付规则，再交付情绪。 |\n| **前因靠行为立，不靠回忆** | 沈砚第一章必须**亲手拒签一次**。读者亲眼看见「签字是有分量的」，前因就立住了——不需要任何回忆插叙。 |\n| **钩子必须是动作，不能是编号** | 「档案里有个 ID」是信息钩，「他按了电梯不是负一」才是情绪钩。**两个都要**，但情绪钩必须放在最后一行。 |\n| **禁止自我纠错句式** | 任何「不对。是……」「其实应该是……」的自我改写一律删除。这是机器味最重的特征。 |\n| **核心术语必须首现即立** | 「续期」是全书核心冲突，第一章必须出现两次：一次规则演示，一次章尾钩子。 |"},"plan":{"body":"{\n  \"version\": 1,\n  \"novelName\": \"注销通知\",\n  \"projectPath\": \"./chinese-novelist/20261015-113633-注销通知\",\n  \"totalChapters\": 24,\n  \"minWordsPerChapter\": 3000,\n  \"createdAt\": \"2026-10-15T11:38:27\",\n  \"updatedAt\": \"2026-10-15T14:58:00\",\n  \"status\": \"in_progress\",\n  \"writingMode\": \"serial\",\n  \"chapters\": [\n    {\n      \"chapterNumber\": 1,\n      \"title\": \"注销通知\",\n      \"filePath\": \"第01章-注销通知.md\",\n      \"status\": \"completed\",\n      \"wordCount\": 3515,\n      \"wordCountPass\": true,\n      \"retryCount\": 0\n    },\n    {\n      \"chapterNumber\": 2,\n      \"title\": \"一千零九十五次\",\n      \"filePath\": \"第02章-一千零九十五次.md\",\n      \"status\": \"pending\",\n      \"wordCount\": null,\n      \"wordCountPass\": null,\n      \"retryCount\": 0\n    },\n    {\n      \"chapterNumber\": 3,\n      \"title\": \"十四个小时\",\n      \"filePath\": \"第03章-十四个小时.md\",\n      \"status\": \"pending\",\n      \"wordCount\": null,\n      \"wordCountPass\": null,\n      \"retryCount\": 0\n    },\n    {\n      \"chapterNumber\": 4,\n      \"title\": \"余额\",\n      \"filePath\": \"第04章-余额.md\",\n      \"status\": \"pending\",\n      \"wordCount\": null,\n      \"wordCountPass\": null,\n      \"retryCount\": 0\n    },\n    {\n      \"chapterNumber\": 5,\n      \"title\": \"诱饵与未到场\",\n      \"filePath\": \"第05章-未到场.md\",\n      \"status\": \"pending\",\n      \"wordCount\": null,\n      \"wordCountPass\": null,\n      \"retryCount\": 0\n    },\n    {\n      \"chapterNumber\": 6,\n      \"title\": \"一个人不该签两次\",\n      \"filePath\": \"第06章-一个人不该签两次.md\",\n      \"status\": \"pending\",\n      \"wordCount\": null,\n      \"wordCountPass\": null,\n      \"retryCount\": /* Markdown → HTML（只保留正文用得到的语法） */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function md(src){
  const L0 = src.replace(/\r/g,"").split("\n");
  const out=[]; let i=0, code=false, buf=[], list=null, lt=null;
  const flush=()=>{ if(list){ out.push(`<${lt}>`+list.map(x=>`<li>${inline(x)}</li>`).join("")+`</${lt}>`); list=null; lt=null; } };
  while(i<L0.length){
    const L=L0[i];
    if(/^```/.test(L)){ flush(); if(!code){code=true;buf=[];} else {out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);code=false;} i++; continue; }
    if(code){ buf.push(L); i++; continue; }
    if(/^\s*$/.test(L)){ flush(); i++; continue; }
    if(/^\s*(?:[—–]{2,}|[-*_]{3,})\s*$/.test(L)){ flush(); out.push("<hr>"); i++; continue; }
    if(/^\s*\|/.test(L) && /^\s*\|[\s:|-]+\|/.test(L0[i+1]||"")){
      flush();
      const c=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      const hd=c(L); i+=2; const rows=[];
      while(i<L0.length && /^\s*\|/.test(L0[i])){ rows.push(c(L0[i])); i++; }
      out.push(`<div class="tw"><table><thead><tr>${hd.map(x=>`<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r=>`<tr>${r.map(x=>`<td>${inline(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h=L.match(/^(#{1,4})\s+(.*)$/);
    if(h){ flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^>\s?/.test(L)){
      flush(); const q=[];
      while(i<L0.length && /^>\s?/.test(L0[i])){ q.push(L0[i].replace(/^>\s?/,"")); i++; }
      out.push(`<blockquote><p>${inline(q.join(" "))}</p></blockquote>`); continue;
    }
    const ol=L.match(/^\s*(\d+)\.\s+(.*)$/), ul=L.match(/^\s*[-*+]\s+(.*)$/);
    if(ol||ul){
      const t=ol?"ol":"ul";
      if(lt && lt!==t) flush();
      lt=t; (list=list||[]).push(ol?ol[2]:ul[1]); i++; continue;
    }
    flush();
    const p=[]; const fld=s=>/^\s*\*\*[^*\n]+\*\*\s*[：:]/.test(s);
    while(i<L0.length && !/^\s*$/.test(L0[i]) && !/^(#{1,4}\s|>|```|\s*[-*+]\s|\s*\d+\.\s|\s*\|)/.test(L0[i])){
      if(fld(L0[i]) && p.length){ out.push(`<p>${inline(p.join(" "))}</p>`); p.length=0; }
      p.push(L0[i]); i++;
    }
    if(p.length) out.push(`<p>${inline(p.join(" "))}</p>`);
  }
  if(code && buf.length) out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

function render(k){
  cur = k;
  const isCh = k==="ch1";
  document.body.dataset.kind = isCh ? "chapter" : "doc";
  document.body.className = isCh ? "chapter" : "doc";
  document.title = isCh ? "第一章 注销通知" : TITLES[k] + " · 注销通知";

  const raw = DATA.docs[k].body;
  const head = isCh
    ? `<div class="chapno">第一章</div><h2 class="chapname">注销通知</h2>`
    : "";
  // 正文里的 H1 是文件名，剥掉；其余原样
  const body = isCh ? raw.replace(/^# .+\n+/,"") : raw;

  document.getElementById("sheet").innerHTML =
    `<div class="sheet fade">${head}<div class="prose">${md(body)}</div>${
      isCh ? `<div class="endmark">第一章 完</div>` : ""}</div>`;

  document.getElementById("nav").innerHTML = ORDER
    .map(x=>`<button data-k="${x}"${x===k?' aria-current="true"':""}>${TITLES[x]}</button>`).join("");

  const done = DATA.plan.chapters.filter(c=>c.status==="completed").length;

       <p class="meta">全书 ${DATA.plan.totalChapters} 章 · 已完成 ${done} 章 · 阅读约 12 分钟</p>`
    : `<button class="next" data-k="ch1">回到正文<small>第一章 注销通知</small></button>
       <p class="meta">已完成 ${done} / ${DATA.plan.totalChapters} 章</p>`;

  window.scrollTo(0,0);
}
document.addEventListener("click", e=>{

  if(b) render(b.dataset.k);
});

<script>
// Initialize floating ball functionality
function initFloatingBall() {
  const ball = document.getElementById('minimax-floating-ball');
  if (!ball) return;

  // Initial animation
  ball.style.opacity = '0';
  ball.style.transform = 'translateY(20px)';

  setTimeout(() => {
    ball.style.opacity = '1';
    ball.style.transform = 'translateY(0)';
  }, 500);

  // Handle logo click
  const ballContent = ball.querySelector('.minimax-ball-content');
  ballContent.addEventListener('click', function (e) {
    e.stopPropagation();
    window.open('https://agent.minimax.cn/', '_blank');
    ball.style.transform = 'scale(0.95)';
    setTimeout(() => {
      ball.style.transform = 'scale(1)';
    }, 100);
  });

  // Handle close button click
  const closeIcon = ball.querySelector('.minimax-close-icon');
  closeIcon.addEventListener('click', function (e) {
    e.stopPropagation();
    ball.style.opacity = '0';
    ball.style.transform = 'translateY(20px)';

    setTimeout(() => {
      ball.style.display = 'none';
    }, 300);
  });
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', initFloatingBall); 
</script>
